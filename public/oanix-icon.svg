<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OANIX</title>
  <desc id="desc">Logo oficial OANIX sobre negro mate: C blanca plateada con destello, bloc grafito con renglones naranja, candado, píxeles y palabra OANIX con X naranja.</desc>

  <defs>
    <radialGradient id="bg" cx="38%" cy="18%" r="96%">
      <stop offset="0" stop-color="#202226"/>
      <stop offset="0.45" stop-color="#14161a"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>

    <linearGradient id="silver" x1="0.12" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#f7f7f7"/>
      <stop offset="0.56" stop-color="#dedfe1"/>
      <stop offset="0.78" stop-color="#a9adb3"/>
      <stop offset="1" stop-color="#5f646b"/>
    </linearGradient>

    <linearGradient id="silverText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.46" stop-color="#dfe1e4"/>
      <stop offset="1" stop-color="#969aa0"/>
    </linearGradient>

    <linearGradient id="page" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#45494f"/>
      <stop offset="0.42" stop-color="#32363c"/>
      <stop offset="1" stop-color="#202328"/>
    </linearGradient>

    <linearGradient id="orange" x1="0.16" y1="0" x2="0.84" y2="1">
      <stop offset="0" stop-color="#ffbb65"/>
      <stop offset="0.32" stop-color="#ff982f"/>
      <stop offset="0.72" stop-color="#f07816"/>
      <stop offset="1" stop-color="#c9580d"/>
    </linearGradient>

    <linearGradient id="orangeBright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd18d"/>
      <stop offset="0.36" stop-color="#ff9b35"/>
      <stop offset="1" stop-color="#ef6d10"/>
    </linearGradient>

    <filter id="softShadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.76"/>
    </filter>

    <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.3" flood-color="#ff7f1d" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.58"/>
    </filter>

    <filter id="whiteGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="wordShadow" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Matte black premium app tile. -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)" stroke="#3a3d42" stroke-width="4"/>
  <rect x="29" y="29" width="454" height="454" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Large unmistakable C: mostly white/silver with controlled dark depth. -->
  <g filter="url(#softShadow)">
    <path
      d="M334 132
         C300 104 249 94 201 104
         C139 117 98 170 98 229
         C98 293 143 345 204 357
         C252 367 302 354 334 326"
      fill="none"
      stroke="#060708"
      stroke-width="58"
      stroke-linecap="butt"
      stroke-linejoin="round"
      opacity="0.72"
      transform="translate(0 7)"/>
    <path
      d="M334 132
         C300 104 249 94 201 104
         C139 117 98 170 98 229
         C98 293 143 345 204 357
         C252 367 302 354 334 326"
      fill="none"
      stroke="url(#silver)"
      stroke-width="48"
      stroke-linecap="butt"
      stroke-linejoin="round"/>
    <path
      d="M326 123
         C291 101 246 96 205 106
         C155 118 121 154 109 197"
      fill="none"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      stroke-opacity="0.64"/>
    <path
      d="M111 239 C114 293 151 332 202 344"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-opacity="0.24"/>
  </g>

  <!-- Orange inner rim gives the C an OANIX signature without overpowering the silver. -->
  <path
    d="M322 145
       C289 120 247 113 207 121
       C154 132 119 178 119 229
       C119 280 155 323 205 333
       C246 341 289 331 321 307"
    fill="none"
    stroke="#ff7d17"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-opacity="0.9"
    filter="url(#orangeGlow)"/>

  <!-- Small light flare on the C. -->
  <g filter="url(#whiteGlow)">
    <path d="M157 119 L157 143" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M145 131 L169 131" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="157" cy="131" r="4.3" fill="#ffffff"/>
  </g>

  <!-- Raised graphite notebook: clearly separated from the black tile. -->
  <g filter="url(#softShadow)">
    <path
      d="M204 162
         Q204 150 216 150
         H326
         L368 192
         V294
         Q368 308 354 308
         H216
         Q204 308 204 296Z"
      fill="url(#page)"
      stroke="#5b6067"
      stroke-width="3"/>
    <path d="M326 150 V186 Q326 192 332 192 H368Z" fill="url(#orange)" stroke="#ffad54" stroke-width="2"/>
    <path d="M219 164 H317" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Notebook binding rings. -->
  <g filter="url(#softShadow)">
    <path d="M192 178 H214" stroke="#aeb2b8" stroke-width="7" stroke-linecap="round"/>
    <path d="M192 218 H214" stroke="#aeb2b8" stroke-width="7" stroke-linecap="round"/>
    <path d="M192 258 H214" stroke="#aeb2b8" stroke-width="7" stroke-linecap="round"/>
    <path d="M192 178 H210" stroke="#1a1c20" stroke-width="4" stroke-linecap="round"/>
    <path d="M192 218 H210" stroke="#1a1c20" stroke-width="4" stroke-linecap="round"/>
    <path d="M192 258 H210" stroke="#1a1c20" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bright orange note rulings. -->
  <g fill="none" stroke="url(#orangeBright)" stroke-width="7" stroke-linecap="round" filter="url(#orangeGlow)">
    <path d="M238 194 H334"/>
    <path d="M238 226 H334"/>
    <path d="M238 258 H321"/>
    <path d="M238 286 H290"/>
  </g>

  <!-- Security lock overlaps the lower-right of the notebook. -->
  <g filter="url(#softShadow)">
    <path
      d="M309 283 V266
         C309 239 325 223 349 223
         C373 223 389 239 389 266
         V283"
      fill="none"
      stroke="#c9ccd1"
      stroke-width="13"
      stroke-linecap="round"/>
    <path
      d="M310 282 V266 C310 242 325 228 349 228 C373 228 388 242 388 266 V282"
      fill="none"
      stroke="#33363b"
      stroke-width="8"
      stroke-linecap="round"/>
    <rect x="299" y="275" width="100" height="82" rx="17" fill="url(#orange)" stroke="#ffac50" stroke-width="3"/>
    <circle cx="349" cy="309" r="11" fill="#0b0d10"/>
    <path d="M343 318 H355 L360 342 H338Z" fill="#0b0d10"/>
  </g>

  <!-- Digital identity pixels. -->
  <g fill="url(#orangeBright)" filter="url(#orangeGlow)">
    <rect x="371" y="111" width="12" height="12" rx="2"/>
    <rect x="398" y="96" width="16" height="16" rx="2.5"/>
    <rect x="428" y="110" width="11" height="11" rx="2"/>
    <rect x="386" y="132" width="11" height="11" rx="2"/>
    <rect x="411" y="127" width="18" height="18" rx="3"/>
    <rect x="441" y="144" width="12" height="12" rx="2"/>
    <rect x="409" y="157" width="13" height="13" rx="2"/>
    <rect x="438" y="172" width="8" height="8" rx="2"/>
  </g>

  <!-- Wordmark: OANI silver, X orange. -->
  <g filter="url(#wordShadow)" font-family="Arial, Helvetica, sans-serif" font-weight="600">
    <text
      x="92"
      y="439"
      fill="url(#silverText)"
      font-size="65"
      letter-spacing="13"
      textLength="272"
      lengthAdjust="spacingAndGlyphs"
    >OANI</text>
    <text
      x="381"
      y="439"
      fill="url(#orangeBright)"
      font-size="68"
      font-weight="650"
      textLength="48"
      lengthAdjust="spacingAndGlyphs"
    >X</text>
  </g>
</svg>

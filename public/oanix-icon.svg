<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OANIX</title>
  <desc id="desc">Símbolo OANIX con O plateada, documento y candado naranja sobre fondo negro.</desc>
  <defs>
    <radialGradient id="bg" cx="35%" cy="24%" r="88%">
      <stop offset="0" stop-color="#17181b"/>
      <stop offset="0.48" stop-color="#090a0c"/>
      <stop offset="1" stop-color="#020203"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#d8d9dc"/>
      <stop offset="0.58" stop-color="#8e9095"/>
      <stop offset="0.8" stop-color="#f0f1f2"/>
      <stop offset="1" stop-color="#73757a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="0.32" stop-color="#ff9a3c"/>
      <stop offset="0.7" stop-color="#ff6a16"/>
      <stop offset="1" stop-color="#d94800"/>
    </linearGradient>
    <linearGradient id="orangeStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc16b"/>
      <stop offset="0.55" stop-color="#ff7a22"/>
      <stop offset="1" stop-color="#ff4d00"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
    <filter id="orangeGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff6a16" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bg)" stroke="#303237" stroke-width="4"/>
  <rect x="27" y="27" width="458" height="458" rx="103" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>

  <g filter="url(#shadow)">
    <circle
      cx="238"
      cy="248"
      r="146"
      fill="none"
      stroke="url(#silver)"
      stroke-width="42"
      stroke-linecap="round"
      stroke-dasharray="744 174"
      transform="rotate(-37 238 248)"
    />
    <circle
      cx="238"
      cy="248"
      r="121"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.09"
      stroke-width="2"
      stroke-dasharray="616 145"
      transform="rotate(-37 238 248)"
    />
  </g>

  <g filter="url(#orangeGlow)">
    <path
      d="M286 145h76l42 42v154c0 13-10 23-23 23H286c-13 0-23-10-23-23V168c0-13 10-23 23-23Z"
      fill="#090a0c"
      stroke="url(#orangeStroke)"
      stroke-width="8"
      stroke-linejoin="round"
    />
    <path d="M362 145v42h42Z" fill="url(#orange)"/>
    <path d="M296 224h74M296 260h74M296 296h52" fill="none" stroke="url(#silver)" stroke-width="10" stroke-linecap="round" opacity="0.72"/>
  </g>

  <g filter="url(#orangeGlow)">
    <path d="M180 250v-27c0-39 25-66 61-66s61 27 61 66v27" fill="none" stroke="url(#orange)" stroke-width="18" stroke-linecap="round"/>
    <rect x="166" y="239" width="150" height="116" rx="24" fill="url(#orange)" stroke="#ffbc65" stroke-width="3"/>
    <circle cx="241" cy="288" r="17" fill="#090a0c"/>
    <path d="M232 300h18l7 34h-32Z" fill="#090a0c"/>
    <path d="M181 256h120" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g fill="url(#orange)" filter="url(#orangeGlow)">
    <rect x="394" y="112" width="14" height="14" rx="3"/>
    <rect x="420" y="135" width="20" height="20" rx="4"/>
    <rect x="397" y="164" width="11" height="11" rx="2.5"/>
  </g>

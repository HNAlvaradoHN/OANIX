<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OANIX</title>
  <desc id="desc">Logo oficial OANIX sobre negro mate: C plateada, candado cobrizo, bloc naranja con renglones, doblez de hoja, píxeles y palabra OANIX con X naranja.</desc>

  <defs>
    <radialGradient id="bg" cx="35%" cy="22%" r="92%">
      <stop offset="0" stop-color="#1e2126"/>
      <stop offset="0.46" stop-color="#15171b"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#e7e7e7"/>
      <stop offset="0.52" stop-color="#bfc2c7"/>
      <stop offset="0.78" stop-color="#8f949a"/>
      <stop offset="1" stop-color="#d7d8da"/>
    </linearGradient>

    <linearGradient id="silverText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.48" stop-color="#d5d7da"/>
      <stop offset="1" stop-color="#90949a"/>
    </linearGradient>

    <linearGradient id="orange" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#f6b35f"/>
      <stop offset="0.32" stop-color="#f29a45"/>
      <stop offset="0.7" stop-color="#e88732"/>
      <stop offset="1" stop-color="#c86a1e"/>
    </linearGradient>

    <linearGradient id="orangeEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b35f"/>
      <stop offset="0.52" stop-color="#e88732"/>
      <stop offset="1" stop-color="#c86a1e"/>
    </linearGradient>

    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.72"/>
    </filter>

    <filter id="orangeGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#e88732" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.52"/>
    </filter>

    <filter id="wordShadow" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.76"/>
    </filter>
  </defs>

  <!-- Matte black app tile with a generous safe area. -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)" stroke="#3a3d42" stroke-width="4"/>
  <rect x="29" y="29" width="454" height="454" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>

  <!-- Main brushed-silver C / open O. -->
  <g filter="url(#softShadow)">
    <circle
      cx="216"
      cy="222"
      r="126"
      fill="none"
      stroke="#07090b"
      stroke-width="56"
      stroke-linecap="butt"
      stroke-dasharray="625 167"
      transform="rotate(-43 216 222)"
      opacity="0.68"
    />
    <circle
      cx="216"
      cy="216"
      r="126"
      fill="none"
      stroke="url(#silver)"
      stroke-width="46"
      stroke-linecap="butt"
      stroke-dasharray="625 167"
      transform="rotate(-43 216 216)"
    />
    <circle
      cx="216"
      cy="216"
      r="104"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.13"
      stroke-width="2.5"
      stroke-dasharray="516 138"
      transform="rotate(-43 216 216)"
    />
  </g>

  <!-- Copper-orange notepad outline with folded upper corner and lower leaf turn. -->
  <g filter="url(#orangeGlow)">
    <path
      d="M292 153
         C323 136 363 138 387 151
         L414 178
         C418 184 420 193 420 202
         V286
         C420 318 399 338 354 357"
      fill="none"
      stroke="url(#orangeEdge)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M385 151 V180 H414"
      fill="none"
      stroke="url(#orangeEdge)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M354 357
         C377 333 386 307 383 280
         C405 295 411 316 401 335
         C393 349 377 357 354 357Z"
      fill="url(#orange)"
      stroke="#e88732"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <path
      d="M359 350 C376 330 384 307 382 288"
      fill="none"
      stroke="#ffd29c"
      stroke-opacity="0.56"
      stroke-width="2"
      stroke-linecap="round"
    />
  </g>

  <!-- Security lock centered inside the C. -->
  <g filter="url(#orangeGlow)">
    <path
      d="M172 228 V207
         C172 174 191 154 220 154
         C249 154 268 174 268 207
         V228"
      fill="none"
      stroke="url(#orange)"
      stroke-width="15"
      stroke-linecap="round"
    />
    <rect x="155" y="218" width="130" height="102" rx="19" fill="url(#orange)" stroke="#f2a04d" stroke-width="3"/>
    <path d="M169 233 H271" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round"/>
    <circle cx="220" cy="260" r="14" fill="#0b0d10"/>
    <path d="M213 270 H227 L233 300 H207Z" fill="#0b0d10"/>
  </g>

  <!-- Copper notebook rulings beside the lock. -->
  <g fill="none" stroke="url(#orangeEdge)" stroke-width="8" stroke-linecap="round" filter="url(#softShadow)" opacity="0.94">
    <path d="M304 199 H373"/>
    <path d="M304 231 H373"/>
    <path d="M304 263 H373"/>
    <path d="M304 295 H350"/>
  </g>

  <!-- Digital pixels dissolving from the upper-right corner. -->
  <g fill="url(#orange)" filter="url(#orangeGlow)">
    <rect x="370" y="102" width="12" height="12" rx="2"/>
    <rect x="397" y="88" width="16" height="16" rx="2.5"/>
    <rect x="426" y="103" width="13" height="13" rx="2"/>
    <rect x="386" y="122" width="11" height="11" rx="2"/>
    <rect x="411" y="122" width="18" height="18" rx="3"/>
    <rect x="441" y="133" width="12" height="12" rx="2"/>
    <rect x="410" y="150" width="13" height="13" rx="2"/>
    <rect x="439" y="160" width="9" height="9" rx="2"/>
  </g>

  <!-- Wordmark stays fully inside the icon: OANI silver, X copper orange. -->
  <g filter="url(#wordShadow)" font-family="Arial, Helvetica, sans-serif" font-weight="600">
    <text
      x="94"
      y="433"
      fill="url(#silverText)"
      font-size="66"
      letter-spacing="13"
      textLength="270"
      lengthAdjust="spacingAndGlyphs"
    >OANI</text>
    <text
      x="379"
      y="433"
      fill="url(#orange)"
      font-size="68"
      font-weight="650"
      textLength="48"
      lengthAdjust="spacingAndGlyphs"
    >X</text>
  </g>
</svg>

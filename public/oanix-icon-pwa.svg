<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OANIX</title>
  <desc id="desc">Vista previa PWA de OANIX: bloc grafito con renglones naranja, candado de seguridad, doblez de hoja, píxeles digitales y palabra OANIX sobre negro mate.</desc>
  <defs>
    <radialGradient id="bg" cx="36%" cy="18%" r="96%">
      <stop offset="0" stop-color="#202328"/>
      <stop offset="0.48" stop-color="#121419"/>
      <stop offset="1" stop-color="#07080a"/>
    </radialGradient>
    <linearGradient id="page" x1="0.08" y1="0" x2="0.94" y2="1">
      <stop offset="0" stop-color="#555b64"/>
      <stop offset="0.42" stop-color="#343941"/>
      <stop offset="1" stop-color="#1d2025"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dfe2e6"/>
      <stop offset="1" stop-color="#8e949c"/>
    </linearGradient>
    <linearGradient id="orange" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#ffc16d"/>
      <stop offset="0.34" stop-color="#ff9a32"/>
      <stop offset="0.72" stop-color="#f27617"/>
      <stop offset="1" stop-color="#c9560d"/>
    </linearGradient>
    <linearGradient id="orangeBright" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#ffd79f"/>
      <stop offset="0.35" stop-color="#ff9b33"/>
      <stop offset="1" stop-color="#ef6b0d"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity="0.72"/>
    </filter>
    <filter id="orangeGlow" x="-55%" y="-55%" width="210%" height="210%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#ff7d19" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="softLight" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wordShadow" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)" stroke="#393d43" stroke-width="4"/>
  <rect x="29" y="29" width="454" height="454" rx="96" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="2"/>

  <!-- Notebook is now the primary OANIX symbol: no C. -->
  <g filter="url(#shadow)">
    <path d="M126 104 Q126 88 142 88 H334 L390 144 V316 Q390 332 374 332 H142 Q126 332 126 316Z"
      fill="#0a0c0f" opacity="0.72" transform="translate(0 9)"/>
    <path d="M126 96 Q126 80 142 80 H334 L390 136 V308 Q390 324 374 324 H142 Q126 324 126 308Z"
      fill="url(#page)" stroke="#676d76" stroke-width="4"/>
    <path d="M334 80 V126 Q334 136 344 136 H390Z" fill="url(#orange)" stroke="#ffb35b" stroke-width="2.5"/>
    <path d="M145 99 H315" stroke="#fff" stroke-opacity="0.12" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Premium binding rings. -->
  <g filter="url(#shadow)">
    <path d="M108 132 H137 M108 184 H137 M108 236 H137 M108 288 H137" stroke="#d5d8dd" stroke-width="9" stroke-linecap="round"/>
    <path d="M108 132 H132 M108 184 H132 M108 236 H132 M108 288 H132" stroke="#202329" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Four unmistakable orange note rulings. -->
  <g filter="url(#orangeGlow)">
    <rect x="169" y="139" width="153" height="13" rx="6.5" fill="url(#orangeBright)"/>
    <rect x="169" y="181" width="153" height="13" rx="6.5" fill="url(#orangeBright)"/>
    <rect x="169" y="223" width="129" height="13" rx="6.5" fill="url(#orangeBright)"/>
    <rect x="169" y="265" width="91" height="13" rx="6.5" fill="url(#orangeBright)"/>
    <path d="M180 142 H309 M180 184 H309 M180 226 H285" stroke="#ffe0b2" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.72"/>
  </g>

  <!-- Security lock attached to the notebook. -->
  <g filter="url(#shadow)">
    <path d="M296 291 V268 C296 232 318 211 350 211 C382 211 404 232 404 268 V291"
      fill="none" stroke="#d2d5da" stroke-width="16" stroke-linecap="round"/>
    <path d="M298 291 V268 C298 237 318 218 350 218 C382 218 402 237 402 268 V291"
      fill="none" stroke="#30343a" stroke-width="9" stroke-linecap="round"/>
    <rect x="282" y="280" width="136" height="100" rx="22" fill="url(#orange)" stroke="#ffb057" stroke-width="3"/>
    <path d="M296 296 H404" stroke="#fff" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round"/>
    <circle cx="350" cy="322" r="14" fill="#0a0c0f"/>
    <path d="M342 333 H358 L365 364 H335Z" fill="#0a0c0f"/>
  </g>

  <!-- Digital pixels and small premium glint. -->
  <g fill="url(#orangeBright)" filter="url(#orangeGlow)">
    <rect x="379" y="82" width="13" height="13" rx="2"/>
    <rect x="407" y="64" width="18" height="18" rx="3"/>
    <rect x="439" y="84" width="12" height="12" rx="2"/>
    <rect x="397" y="105" width="11" height="11" rx="2"/>
    <rect x="423" y="108" width="17" height="17" rx="3"/>
    <rect x="452" y="126" width="9" height="9" rx="2"/>
  </g>
  <g filter="url(#softLight)">
    <path d="M161 92 V112 M151 102 H171" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="161" cy="102" r="3.7" fill="#fff"/>
  </g>

  <!-- Wordmark stays complete and safely inside the tile. -->
  <g filter="url(#wordShadow)" font-family="Arial, Helvetica, sans-serif" font-weight="600">
    <text x="91" y="449" fill="url(#silver)" font-size="64" letter-spacing="13" textLength="273" lengthAdjust="spacingAndGlyphs">OANI</text>
    <text x="382" y="449" fill="url(#orangeBright)" font-size="68" font-weight="650" textLength="48" lengthAdjust="spacingAndGlyphs">X</text>
  </g>
</svg>

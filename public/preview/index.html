<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>OANIX</title>
<style>
:root{
  --bg-0:#07070c; --bg-1:#0d0d15; --bg-2:#14141f; --bg-3:#1c1c2b;
  --line:rgba(255,255,255,.07); --text:#eceaf6; --text-2:#9b97b0;
  --grad:linear-gradient(135deg,#7c5cff,#c86bff 55%,#ff6ec7);
  --grad-soft:linear-gradient(135deg,rgba(124,92,255,.16),rgba(255,110,199,.10));
  --danger:#ff4d6d; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg-0);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(700px 500px at 12% -8%,rgba(124,92,255,.20),transparent 65%),
    radial-gradient(800px 600px at 108% 108%,rgba(255,110,199,.12),transparent 65%),
    radial-gradient(500px 400px at 80% 0%,rgba(64,201,255,.08),transparent 60%)}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}

.shell{display:flex;flex-direction:column;height:100dvh}

/* ══ Barra superior ══ */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex:none;
  background:rgba(13,13,21,.92);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-badge{width:38px;height:38px;border-radius:12px;background:#0a0a0a;
  border:1px solid rgba(255,157,77,.4);display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 14px rgba(255,157,77,.18)}
.brand-name{font-weight:800;letter-spacing:2px;font-size:15px}
.search{flex:1;max-width:420px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;outline:none;transition:border-color .15s}
.search:focus{border-color:rgba(124,92,255,.6)}
.ticons{display:flex;gap:4px;align-items:center}
.ticon{width:40px;height:40px;border:0;background:transparent;border-radius:12px;
  display:grid;place-items:center;color:var(--text-2);transition:background .15s,color .15s}
.ticon:hover{background:var(--bg-2);color:var(--text)}
.ticon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.icon-btn{border:1px solid var(--line);background:var(--bg-2);border-radius:10px;
  width:40px;height:40px;font-size:16px;display:grid;place-items:center}

/* ══ Carpetas: pestañas de alta prioridad ══ */
.ftabs{display:flex;gap:2px;overflow-x:auto;flex:none;padding:0 8px;
  background:rgba(13,13,21,.94);border-bottom:1px solid var(--line);position:relative}
.ftabs::-webkit-scrollbar{height:0}
.ftab{position:relative;border:0;background:none;color:var(--text-2);
  padding:9px 13px;font-size:14px;white-space:nowrap;flex:none;display:flex;align-items:center;gap:7px}
.ftab .n{font-size:11px;color:var(--text-2);margin-left:1px;opacity:.8}
.ftab.active{color:var(--text);font-weight:600}
.ftab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;
  border-radius:3px;background:var(--folder-color,var(--grad))}
.ftab-folder-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;
  border:1px solid transparent;font-size:14px;transition:transform .15s,box-shadow .15s}
.ftab.active .ftab-folder-icon{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.22)}
.folder-sic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;
  border:1px solid transparent;font-size:15px}
.nava{border:1px solid transparent;box-shadow:0 0 0 2px rgba(255,255,255,.025)}
/* ══ Etiquetas: chips de baja prioridad ══ */
.tagstrip{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;flex:none;
  border-bottom:1px solid var(--line);position:relative}
.tagstrip::-webkit-scrollbar{height:0}
.tagstrip.hide{display:none}
.tchip{flex:none;font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  color:var(--text-2);background:transparent;display:flex;align-items:center;gap:6px}
.tchip.on{color:var(--text);border-color:rgba(124,92,255,.5);background:var(--grad-soft)}
.mode-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  border:1px solid rgba(124,92,255,.35);background:var(--grad-soft);color:var(--text);font-size:11.5px}
.cdot{width:6px;height:6px;border-radius:50%;flex:none}

/* ══ Notas ══ */
.rows-wrap{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0;padding-bottom:76px}
.rows-space{position:relative}
.rows-box{position:absolute;left:0;right:0;top:0}
.nrow{height:78px;display:flex;gap:12px;align-items:center;padding:0 14px;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-touch-callout:none}
.nrow:active{background:var(--bg-2)}
.nava{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  font-size:20px;flex:none}
.nmain{flex:1;min-width:0}
.nmain h4{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nmain p{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nmeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;
  font-size:11px;color:var(--text-2)}
.empty{margin:20px 14px;padding:34px 20px;border:1px dashed var(--line);border-radius:16px;
  color:var(--text-2);font-size:13.5px;text-align:center}

/* ══ Cajón de gestión ══ */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:min(720px,96vw);z-index:72;
  background:var(--bg-1);border-right:1px solid var(--line);padding:16px 12px;
  display:flex;flex-direction:column;min-height:0;transform:translateX(-105%);
  transition:transform .25s ease;box-shadow:18px 0 50px rgba(0,0,0,.28)}
.sidebar.open{transform:translateX(0)}
.s-head{padding:0 8px 14px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.s-brandwrap{display:flex;align-items:center;gap:8px;min-width:0}
.s-close{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;
  background:var(--bg-2);color:var(--text-2);display:grid;place-items:center;flex:none;
  transition:background .15s,color .15s,transform .15s}
.s-close:hover{background:var(--grad-soft);color:var(--text)}
.s-close:active{transform:scale(.94)}
.s-close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.s-actions{display:flex;align-items:center;gap:8px}
.s-action{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;
  background:var(--bg-2);color:var(--text-2);display:grid;place-items:center;font-size:20px;
  transition:background .15s,color .15s,transform .15s}
.s-action:hover{background:var(--grad-soft);color:var(--text)}
.s-action:active{transform:scale(.94)}
.s-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;
  flex:1;min-height:0}
.s-section{display:flex;flex-direction:column;min-width:0;min-height:0;
  border:1px solid var(--line);background:rgba(255,255,255,.015);border-radius:14px;overflow:hidden}
.s-labelrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-2);
  padding:12px 12px 9px;display:flex;justify-content:space-between;align-items:center;flex:none;
  border-bottom:1px solid var(--line)}
.s-count{font-size:10px;letter-spacing:0;background:var(--bg-2);padding:2px 7px;border-radius:999px}
.s-list{overflow-y:auto;min-height:0;padding:6px}
.srow{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:9px;
  color:var(--text-2);cursor:pointer;user-select:none;-webkit-touch-callout:none;
  transition:background .12s,color .12s;min-height:42px}
.srow:hover{background:var(--bg-2);color:var(--text)}
.sic{width:22px;text-align:center;flex:none}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;margin:0 5px}
.sname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smarks{font-size:10px;opacity:.9;white-space:nowrap}
.kebab{border:0;background:transparent;color:var(--text-2);width:28px;height:28px;
  border-radius:8px;font-size:16px;display:grid;place-items:center;flex:none}
.kebab:hover{background:var(--bg-3);color:var(--text)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;opacity:0;
  pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
body.drawer-open .bnav{display:none}

/* Reordenación libre */
.reorder-list{max-height:min(56vh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:7px;
  margin-top:12px;padding:3px;overscroll-behavior:contain}
.reorder-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);
  border-radius:12px;background:var(--bg-0);user-select:none;transition:transform .16s,border-color .16s;
  touch-action:pan-y}
.reorder-item .r-icon{width:28px;text-align:center;flex:none}
.reorder-item .r-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reorder-handle{width:38px;height:38px;border:0;border-radius:10px;background:var(--bg-2);
  color:var(--text-2);font-size:21px;display:grid;place-items:center;touch-action:none;cursor:grab}
.reorder-item.dragging{opacity:1;transform:scale(1.025);z-index:4;filter:brightness(1.12);
  border-color:#7c5cff;box-shadow:0 12px 28px rgba(0,0,0,.4),0 0 0 1px #7c5cff}
.reorder-note{font-size:12px;color:var(--text-2);margin-top:-4px}
/* ══ Arrastre ══ */
.dragging{opacity:1;transform:scale(1.08) rotate(1.5deg);cursor:grabbing;
  position:relative;z-index:80;transition:none!important;filter:brightness(1.15);
  box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 0 2px #7c5cff,0 0 24px rgba(124,92,255,.5)}
.armed{transform:scale(.97);opacity:.75}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.is-dragging [data-ctx]:not(.dragging){opacity:.45}
body.is-dragging .dnd [data-ctx]{transition:transform .18s ease}

/* ══ Editor ══ */
.editor{position:fixed;inset:0;z-index:70;background:var(--bg-0);display:none;flex-direction:column}
.editor.open{display:flex}
.ed-head{display:flex;align-items:center;gap:8px;padding:10px 12px;flex:none;border-bottom:1px solid var(--line)}
.ed-title{flex:1;background:none;border:0;outline:none;font-size:16px;font-weight:600;min-width:0}
.ed-body{flex:1;overflow-y:auto;padding:18px 16px 30px;min-height:0}
.ed-inner{max-width:860px;margin:0 auto;border-radius:14px;padding:6px 14px;transition:background .2s}
.block{position:relative;margin-bottom:14px}
.bdel{position:absolute;top:2px;right:0;width:24px;height:24px;border:0;border-radius:7px;
  background:transparent;color:var(--text-2);opacity:.55;font-size:12px}
.b-text{width:100%;background:transparent;border:0;outline:none;resize:none;overflow:hidden;
  font-size:15px;line-height:1.7;color:inherit;display:block}
.b-code{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;
  padding:12px;outline:none;resize:none;overflow:hidden;display:block;
  font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#cfe3ff}
.b-sep hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.b-contact{display:flex;flex-direction:column;gap:8px}
.b-contact input{background:var(--bg-1);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.b-check .ck{display:flex;align-items:center;gap:10px;padding:6px 0}
.b-check .done{text-decoration:line-through;opacity:.55}
.ed-add{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;flex:none;border-top:1px solid var(--line);background:var(--bg-1)}
.ed-add::-webkit-scrollbar{height:0}
.ed-add button{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg-2);font-size:12.5px;color:var(--text-2)}

/* ══ Menú / modal ══ */
.ctx{position:fixed;z-index:100;min-width:210px;background:var(--bg-3);border:1px solid var(--line);
  border-radius:12px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.55);display:none}
.ctx.show{display:block;animation:pop .12s ease}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;
  background:none;border-radius:8px;text-align:left;font-size:13.5px;min-height:42px}
.ctx button:hover{background:var(--bg-2)}
.ctx button.danger{color:var(--danger)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:5px 8px}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px}
.overlay.show{display:grid}
.modal{width:min(460px,100%);max-height:min(88dvh,760px);overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
  border:1px solid var(--line);border-radius:16px;padding:20px;animation:pop .15s ease;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{font-size:16px;margin-bottom:4px}
.modal input{width:100%;background:var(--bg-0);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.modal input:focus{border-color:rgba(124,92,255,.6)}
.create-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.create-preview{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:14px;
  background:var(--grad);box-shadow:0 7px 22px rgba(124,92,255,.30);font-size:21px;color:#fff}
.create-copy p{font-size:12px;color:var(--text-2)}
.m-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-2);margin:16px 0 8px}
.icon-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
.ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;
  border:1px solid var(--line);background:var(--bg-0)}
.ic.sel{border-color:rgba(124,92,255,.7);background:var(--grad-soft)}
.swatch-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:10px}
.sw{width:36px;height:36px;border-radius:11px;border:2px solid transparent;transition:transform .12s}
.sw.sel{border-color:#fff;transform:scale(1.1)}
.m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn-primary{background:var(--grad);border:0;border-radius:10px;padding:9px 14px;font-weight:600;color:#fff;
  box-shadow:0 4px 18px rgba(124,92,255,.35)}
.btn-ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--text-2)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border:1px solid var(--line);
  background:var(--bg-0);border-radius:12px;margin-bottom:8px;text-align:left;font-size:14px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);
  background:var(--bg-3);border:1px solid var(--line);border-radius:10px;padding:10px 16px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:110}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══ Barra inferior ══ */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:flex-end;
  justify-content:space-around;background:rgba(13,13,21,.96);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav .nb{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;
  color:var(--text-2);font-size:10.5px;padding:4px 10px;min-width:58px;min-height:46px;border-radius:12px}
.bnav .nb.active{color:var(--text)}
.bnav .bic{font-size:20px;line-height:1.2}
.fab{width:56px;height:56px;border-radius:50%;background:var(--grad);border:0;color:#fff;
  font-size:26px;line-height:1;box-shadow:0 6px 22px rgba(124,92,255,.45);margin-top:-24px;flex:none}

/* ══ Responsive / día ══ */
@media(min-width:900px){
  .rows-box,.ed-inner{max-width:900px;margin:0 auto}
  .brand-name{display:block}
}
@media(max-width:900px){
  .brand-name{display:none}
  .brand-badge{width:36px;height:36px}
  .icon-btn,.ticon{width:36px;height:36px}
  .search{display:none}
  .topbar.searching .search{display:block;position:absolute;left:10px;right:10px;top:8px;max-width:none;height:41px;z-index:5}
  .topbar{position:relative}
  .topbar.searching .brand,.topbar.searching .ticons,.topbar.searching .icon-btn{visibility:hidden}
  .overlay{align-items:flex-end;padding:0}
  .modal{width:100%;max-height:86dvh;border-radius:18px 18px 0 0;
    padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
body.light{
  --bg-0:#f4f4f8; --bg-1:#ffffff; --bg-2:#ececf2; --bg-3:#e2e2ea;
  --line:rgba(20,20,40,.08); --text:#17171f; --text-2:#5c5c6e;
  --grad-soft:linear-gradient(135deg,rgba(124,92,255,.12),rgba(255,110,199,.08));
  color-scheme:light;
}
body.light::before{background:
  radial-gradient(700px 500px at 12% -8%,rgba(124,92,255,.10),transparent 65%),
  radial-gradient(800px 600px at 108% 108%,rgba(255,110,199,.08),transparent 65%),
  radial-gradient(500px 400px at 80% 0%,rgba(64,201,255,.06),transparent 60%)}
body.light .topbar,body.light .ftabs{background:rgba(255,255,255,.94)}
body.light .bnav{background:rgba(255,255,255,.96)}
body.light .ftab-create,body.light .tchip-create{box-shadow:-10px 0 16px rgba(244,244,248,.96),0 4px 14px rgba(124,92,255,.12)}
body.light .b-code{color:#1c2b4a;background:rgba(0,0,0,.05)}
@media(max-width:520px){
  .sidebar{width:100vw;padding:12px 8px}
  .s-columns{gap:6px}
  .s-section{border-radius:12px}
  .srow{padding:8px 5px;gap:5px}
  .smarks{display:none}
  .s-labelrow{padding-left:8px;padding-right:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button class="icon-btn" id="menu-btn">☰</button>
    <div class="brand">
      <span class="brand-badge">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffb648"/><stop offset="1" stop-color="#ff6ec7"/>
          </linearGradient></defs>
          <path d="M15.5 7.5a6.5 6.5 0 1 0 0 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          <rect x="12.8" y="11" width="7.4" height="6.2" rx="1.6" fill="url(#og)"/>
          <path d="M14.8 11V9.6a1.9 1.9 0 0 1 3.8 0V11" fill="none" stroke="url(#og)" stroke-width="1.5"/>
        </svg>
      </span>
      <span class="brand-name">OANIX</span>
    </div>
    <input class="search" id="search" placeholder="Buscar notas…"/>
    <span style="flex:1"></span>
    <div class="ticons">
      <button class="ticon" id="t-search" title="Buscar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4-4"/></svg>
      </button>
      <button class="ticon" id="t-theme" title="Modo día/noche">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="ticon" id="t-user" title="Perfil">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3.1-6 7-6s7 2 7 6"/></svg>
      </button>
    </div>
  </header>

  <nav class="ftabs" id="ftabs"></nav>
  <div class="tagstrip" id="tagstrip"></div>

  <div class="rows-wrap" id="rows-wrap">
    <div class="rows-space" id="rows-space"><div class="rows-box" id="rows-box"></div></div>
  </div>
</div>

<nav class="bnav">
  <button class="nb active" data-nav="home"><span class="bic">🏠</span>Inicio</button>
  <button class="nb" data-nav="search"><span class="bic">🔍</span>Buscar</button>
  <button class="fab" id="fab">＋</button>
  <button class="nb" data-nav="recents"><span class="bic">🕘</span>Recientes</button>
  <button class="nb" data-nav="settings"><span class="bic">⚙️</span>Ajustes</button>
</nav>

<aside class="sidebar" id="sidebar">
  <div class="s-head">
    <div class="s-brandwrap">
      <button class="s-close" id="side-close" title="Cerrar panel" aria-label="Cerrar panel">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand">
        <span class="brand-badge">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M15.5 7.5a6.5 6.5 0 1 0 0 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
            <rect x="12.8" y="11" width="7.4" height="6.2" rx="1.6" fill="url(#og)"/>
            <path d="M14.8 11V9.6a1.9 1.9 0 0 1 3.8 0V11" fill="none" stroke="url(#og)" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="brand-name">OANIX</span>
      </div>
    </div>
    <div class="s-actions">
      <button class="s-action" id="side-create" title="Crear carpeta o etiqueta" aria-label="Crear carpeta o etiqueta">＋</button>
      <button class="s-action" id="side-move" title="Reordenar carpetas o etiquetas" aria-label="Reordenar carpetas o etiquetas">↕</button>
    </div>
  </div>
  <div class="s-columns">
    <section class="s-section">
      <div class="s-labelrow">Carpetas <span class="s-count" id="sfc">0</span></div>
      <div class="s-list dnd" id="s-folders"></div>
    </section>
    <section class="s-section">
      <div class="s-labelrow">Etiquetas <span class="s-count" id="stc">0</span></div>
      <div class="s-list dnd" id="s-tags"></div>
    </section>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="editor" id="editor">
  <div class="ed-head">
    <button class="icon-btn" id="ed-back">←</button>
    <input class="ed-title" id="ed-title" placeholder="Título" maxlength="60"/>
    <button class="ticon" id="ed-sheet" title="Cambiar hoja">🎨</button>
    <button class="ticon" id="ed-menu" style="font-size:18px">⋮</button>
  </div>
  <div class="ed-body"><div class="ed-inner" id="ed-body"></div></div>
  <div class="ed-add" id="ed-add"></div>
</div>

<div class="ctx" id="ctx"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var PALETTE=[
    ['#7c5cff','#ff6ec7'],['#40c9ff','#7c5cff'],['#00d68f','#40c9ff'],
    ['#ffb648','#ff6ec7'],['#ff4d6d','#ff9d4d'],['#8a8a92','#3a3a46'],
    ['#ff7a59','#ffb347'],['#ffd166','#f59e0b'],['#34d399','#16a34a'],
    ['#2dd4bf','#06b6d4'],['#60a5fa','#2563eb'],['#a78bfa','#7c3aed'],
    ['#f472b6','#db2777'],['#fb7185','#e11d48'],['#c084fc','#8b5cf6'],
    ['#94a3b8','#475569']
  ];
  var ICONS=[
    '📁','💼','🎯','💡','🧠','🔧','📚','🎨','🏠','💳','✈️','🧪',
    '⭐','❤️','🚀','📷','🎵','🎮','🍽️','🏋️','🛒','💰','🗓️','🔒',
    '👥','🐾','🌱','⚡','🔥','☕','🎓','🧳','🩺','📝','📦','🛠️'
  ];
  var SHEETS=[{bg:'transparent',tx:''},{bg:'#f6efe1',tx:'#40342a'},{bg:'#0e1a13',tx:'#d9ead9'}];
  var KEY='oanix-v2-preview';
  var now=Date.now();

  function defaults(){
    return {
      folders:[
        {id:1,name:'Personal',icon:'🏠',ci:0,pinned:false,fav:false},
        {id:2,name:'Trabajo',icon:'💼',ci:1,pinned:false,fav:false},
        {id:3,name:'Snippets',icon:'🔧',ci:2,pinned:false,fav:false}
      ],
      tags:[
        {id:1,name:'urgente',ci:4,pinned:false,fav:false},
        {id:2,name:'ideas',ci:1,pinned:false,fav:false},
        {id:3,name:'viajes',ci:2,pinned:false,fav:false}
      ],
      notes:[
        {id:1,folder:1,tags:['ideas'],title:'Roadmap Q3',pinned:true,fav:false,sheet:0,updated:now-3600e3,
          blocks:[{id:11,type:'text',data:'Prioridades del sprint y métricas objetivo.'},{id:12,type:'checklist',data:[{t:'Editor offline',d:1},{t:'Exportación PDF',d:0}]}]},
        {id:2,folder:2,tags:['urgente'],title:'Ideas de producto',pinned:false,fav:true,sheet:0,updated:now-86400e3,
          blocks:[{id:21,type:'text',data:'Onboarding con IA, modo enfoque…'}]},
        {id:3,folder:3,tags:[],title:'Snippets SSH',pinned:false,fav:false,sheet:0,updated:now-3*86400e3,
          blocks:[{id:31,type:'code',data:'ssh -i ~/.ssh/id_ed25519 user@host\\nscp file user@host:/dest'}]}
      ],
      trash:[]
    };
  }

  var db;
  try{db=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){db=defaults()}
  if(!db.notes)db.notes=[];
  if(!db.trash)db.trash=[];

  function save(){localStorage.setItem(KEY,JSON.stringify(db))}
  function $(s){return document.querySelector(s)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}
  function grad(i){return 'linear-gradient(135deg,'+PALETTE[i][0]+','+PALETTE[i][1]+')'}
  function uid(){return Date.now()+Math.floor(Math.random()*999)}
  function rel(ts){var d=Date.now()-ts;if(d<3600e3)return Math.max(1,Math.floor(d/60e3))+' min';if(d<86400e3)return Math.floor(d/3600e3)+' h';return Math.floor(d/86400e3)+' d'}
  function excerpt(n){var b=n.blocks.find(function(x){return x.type==='text'||x.type==='code'});return b?String(b.data).slice(0,70):'📎 '+n.blocks.length+' bloques'}

  var toastT;
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1800)}

  var actF='all',actTags=new Set(),q='',currentNote=null,viewMode='home';
  var ROW_H=78,vS=-1,vE=-1,cache=[];
  var wrap=$('#rows-wrap'),space=$('#rows-space'),box=$('#rows-box');

  function filteredNotes(){
    var L=db.notes.filter(function(n){
      if(viewMode==='recents')return !q||n.title.toLowerCase().indexOf(q)>=0;
      return (actF==='all'||n.folder===actF)&&
        Array.from(actTags).every(function(t){return n.tags.indexOf(t)>=0})&&
        (!q||n.title.toLowerCase().indexOf(q)>=0);
    });
    if(viewMode==='recents')L.sort(function(a,b){return b.updated-a.updated});
    else L.sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||(b.updated-a.updated)});
    return L;
  }
  function noteRow(n){
    var f=db.folders.find(function(x){return x.id===n.folder})||{icon:'📝',ci:5};
    var a=PALETTE[f.ci][0],b=PALETTE[f.ci][1];
    return '<div class="nrow" data-ctx="note:'+n.id+'" data-open="note:'+n.id+'">'+
      '<span class="nava" style="background:linear-gradient(135deg,'+rgba(a,.85)+','+rgba(b,.85)+');border-color:'+rgba(a,.72)+';box-shadow:0 0 0 2px '+rgba(a,.10)+'">'+f.icon+'</span>'+
      '<span class="nmain"><h4>'+esc(n.title)+'</h4><p>'+esc(excerpt(n))+'</p></span>'+
      '<span class="nmeta"><time>'+rel(n.updated)+'</time><span>'+(n.pinned?'📌':'')+(n.fav?'★':'')+(n.hash?'🔒':'')+'</span></span></div>';
  }
  function layoutList(){
    var total=cache.length;
    space.style.height=(total*ROW_H+90)+'px';
    if(!total){box.style.transform='';box.innerHTML='<div class="empty">No hay notas con estos filtros.</div>';vS=vE=-1;return}
    var st=wrap.scrollTop,vh=wrap.clientHeight;
    var s=Math.max(0,Math.floor(st/ROW_H)-4),e=Math.min(total,Math.ceil((st+vh)/ROW_H)+4);
    if(s===vS&&e===vE)return;
    vS=s;vE=e;box.style.transform='translateY('+(s*ROW_H)+'px)';
    box.innerHTML=cache.slice(s,e).map(noteRow).join('');
  }
  function renderList(){cache=filteredNotes();vS=vE=-1;layoutList()}

  function renderTabs(){
    var tabs=$('#ftabs');
    tabs.style.display=viewMode==='recents'?'none':'';
    function cnt(id){return db.notes.filter(function(n){return n.folder===id}).length}
    var html='<button class="ftab '+(actF==='all'?'active':'')+'" data-f="all">Todas<span class="n">'+db.notes.length+'</span></button>';
    html+=db.folders.map(function(f){
      var a=PALETTE[f.ci][0],b=PALETTE[f.ci][1];
      return '<button class="ftab '+(actF===f.id?'active':'')+'" data-f="'+f.id+'" style="--folder-color:'+a+'">'+
        '<span class="ftab-folder-icon" style="background:linear-gradient(135deg,'+rgba(a,.22)+','+rgba(b,.10)+');border-color:'+rgba(a,.58)+'">'+f.icon+'</span>'+
        '<span>'+esc(f.name)+'</span><span class="n">'+cnt(f.id)+'</span></button>';
    }).join('');
    tabs.innerHTML=html;
  }
  function renderStrip(){
    if(viewMode==='recents'){
      $('#tagstrip').innerHTML='<span class="mode-chip">🕘 Recientes · últimas notas modificadas</span>';
      $('#tagstrip').style.display='';
      $('#tagstrip').classList.remove('hide');
      return;
    }
    var html=db.tags.map(function(t){
      return '<button class="tchip '+(actTags.has(t.name)?'on':'')+'" data-tag="'+esc(t.name)+'">'+
        '<span class="cdot" style="background:'+grad(t.ci)+'"></span>'+esc(t.name)+'</button>';
    }).join('');
    $('#tagstrip').innerHTML=html;
    $('#tagstrip').style.display=db.tags.length?'':'none';
  }
  function renderDrawer(){
    $('#sfc').textContent=db.folders.length;
    $('#stc').textContent=db.tags.length;
    $('#s-folders').innerHTML=db.folders.map(function(f){
      var a=PALETTE[f.ci][0],b=PALETTE[f.ci][1];
      return '<div class="srow" data-ctx="folder:'+f.id+'"><span class="folder-sic" style="background:linear-gradient(135deg,'+rgba(a,.20)+','+rgba(b,.08)+');border-color:'+rgba(a,.58)+'">'+f.icon+'</span>'+
        '<span class="sname">'+esc(f.name)+'</span><span class="smarks">'+(f.pinned?'📌':'')+(f.fav?'★':'')+(f.hash?'🔒':'')+'</span>'+
        '<button class="kebab" data-kebab="folder:'+f.id+'">⋮</button></div>';
    }).join('')||'<div class="srow">Sin carpetas</div>';
    $('#s-tags').innerHTML=db.tags.map(function(t){
      return '<div class="srow" data-ctx="tag:'+t.id+'"><span class="sdot" style="background:'+grad(t.ci)+'"></span>'+
        '<span class="sname">'+esc(t.name)+'</span><button class="kebab" data-kebab="tag:'+t.id+'">⋮</button></div>';
    }).join('')||'<div class="srow">Sin etiquetas</div>';
  }
  function render(){renderTabs();renderStrip();renderDrawer();renderList()}
  render();

  $('#ftabs').addEventListener('click',function(e){
    var b=e.target.closest('[data-f]');if(!b)return;
    viewMode='home';actF=b.dataset.f==='all'?'all':+b.dataset.f;renderTabs();renderStrip();renderList();
  });
  $('#tagstrip').addEventListener('click',function(e){
    var c=e.target.closest('[data-tag]');if(!c)return;
    viewMode='home';var t=c.dataset.tag;actTags.has(t)?actTags.delete(t):actTags.add(t);renderTabs();renderStrip();renderList();
  });

  var lastST=0;
  wrap.addEventListener('scroll',function(){
    var st=wrap.scrollTop;
    if(st>lastST+8&&st>140)$('#tagstrip').classList.add('hide');
    else if(st<lastST-8)$('#tagstrip').classList.remove('hide');
    lastST=st;requestAnimationFrame(layoutList);
  },{passive:true});

  var editor=$('#editor'),edBody=$('#ed-body');
  function applySheet(){var s=SHEETS[currentNote.sheet||0];edBody.style.background=s.bg;edBody.style.color=s.tx}
  function fit(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
  function blockHTML(bl){
    var del='<button class="bdel" data-del="'+bl.id+'">✕</button>';
    if(bl.type==='text')return '<div class="block">'+del+'<textarea class="b-text" data-b="'+bl.id+'" placeholder="Escribe…">'+esc(bl.data)+'</textarea></div>';
    if(bl.type==='code')return '<div class="block">'+del+'<textarea class="b-code" data-b="'+bl.id+'" spellcheck="false">'+esc(bl.data)+'</textarea></div>';
    if(bl.type==='sep')return '<div class="block b-sep">'+del+'<hr/></div>';
    if(bl.type==='contact')return '<div class="block b-contact">'+del+
      '<input data-b="'+bl.id+'" data-k="n" placeholder="Nombre" value="'+esc(bl.data.n)+'"/>'+
      '<input data-b="'+bl.id+'" data-k="p" placeholder="Teléfono" value="'+esc(bl.data.p)+'"/></div>';
    if(bl.type==='checklist'){
      var items=bl.data.map(function(it,i){return '<label class="ck"><input type="checkbox" data-ck="'+bl.id+':'+i+'" '+(it.d?'checked':'')+'/>'+
        '<span class="'+(it.d?'done':'')+'">'+esc(it.t)+'</span></label>'}).join('');
      return '<div class="block b-check">'+del+items+'<button class="btn-ghost ck-add" data-ckadd="'+bl.id+'">＋ Ítem</button></div>';
    }
    return '';
  }
  function renderEditor(){
    $('#ed-title').value=currentNote.title;
    edBody.innerHTML=currentNote.blocks.map(blockHTML).join('')||'<div class="empty">Nota vacía. Agrega bloques abajo.</div>';
    edBody.querySelectorAll('textarea').forEach(fit);applySheet();
  }
  function openNote(id){var n=db.notes.find(function(x){return x.id===id});if(!n)return;currentNote=n;editor.classList.add('open');renderEditor()}
  $('#ed-back').onclick=function(){editor.classList.remove('open');currentNote=null;render()};
  $('#ed-title').addEventListener('input',function(e){if(!currentNote)return;currentNote.title=e.target.value;currentNote.updated=Date.now();save()});
  $('#ed-sheet').onclick=function(){if(!currentNote)return;currentNote.sheet=((currentNote.sheet||0)+1)%SHEETS.length;applySheet();save();toast('Hoja cambiada')};
  $('#ed-menu').onclick=function(e){if(currentNote){var r=e.target.getBoundingClientRect();openCtx('note',currentNote.id,r.left-180,r.bottom+6)}};

  var ADDS=[['text','✍️ Texto'],['code','💻 Código'],['checklist','✅ Checklist'],['contact','👤 Contacto'],['sep','➖ Separador']];
  $('#ed-add').innerHTML=ADDS.map(function(a){return '<button data-add="'+a[0]+'">'+a[1]+'</button>'}).join('');
  $('#ed-add').addEventListener('click',function(e){
    var b=e.target.closest('[data-add]');if(!b||!currentNote)return;
    var t=b.dataset.add,id=uid(),data='';
    if(t==='checklist')data=[{t:'Nuevo ítem',d:0}];
    if(t==='contact')data={n:'',p:''};
    if(t==='sep')data=null;
    currentNote.blocks.push({id:id,type:t,data:data});currentNote.updated=Date.now();save();renderEditor();
  });
  edBody.addEventListener('input',function(e){
    var t=e.target;
    if(t.dataset.b&&!t.dataset.k){
      var bl=currentNote.blocks.find(function(b){return b.id===+t.dataset.b});
      if(bl){bl.data=t.value;currentNote.updated=Date.now();save();if(t.tagName==='TEXTAREA')fit(t)}
    }else if(t.dataset.k){
      var bl2=currentNote.blocks.find(function(b){return b.id===+t.dataset.b});
      if(bl2){bl2.data[t.dataset.k]=t.value;save()}
    }
  });
  edBody.addEventListener('change',function(e){
    if(e.target.dataset.ck){
      var p=e.target.dataset.ck.split(':'),bl=currentNote.blocks.find(function(b){return b.id===+p[0]});
      if(bl){bl.data[+p[1]].d=e.target.checked?1:0;save();renderEditor()}
    }
  });
  edBody.addEventListener('click',function(e){
    var del=e.target.closest('[data-del]');
    if(del){currentNote.blocks=currentNote.blocks.filter(function(b){return b.id!==+del.dataset.del});save();renderEditor();toast('Bloque eliminado');return}
    var ck=e.target.closest('[data-ckadd]');
    if(ck){var bl=currentNote.blocks.find(function(b){return b.id===+ck.dataset.ckadd});if(bl){bl.data.push({t:'Nuevo ítem',d:0});save();renderEditor()}}
  });

  var ctx=$('#ctx');
  function closeCtx(){ctx.classList.remove('show')}
  function placeCtx(x,y,anchor){
    var mw=ctx.offsetWidth,mh=ctx.offsetHeight,pad=8,left,top;
    if(anchor){
      left=anchor.right-mw;
      var below=innerHeight-anchor.bottom-pad;
      var above=anchor.top-pad;
      if(below>=mh||below>=above)top=anchor.bottom+6;
      else top=anchor.top-mh-6;
    }else{
      left=x;
      top=(y+mh>innerHeight-pad)?y-mh:y;
    }
    ctx.style.left=Math.max(pad,Math.min(left,innerWidth-mw-pad))+'px';
    ctx.style.top=Math.max(pad,Math.min(top,innerHeight-mh-pad))+'px';
  }
  function openCtx(type,id,x,y,anchor){
    var arr=type==='note'?db.notes:db[type+'s'];
    var it=arr.find(function(o){return o.id===id});if(!it)return;
    var armedDel=false;ctx.innerHTML='';
    function add(label,fn,danger){
      var b=document.createElement('button');b.textContent=label;if(danger)b.className='danger';
      b.onclick=function(){fn(b);save();render()};ctx.appendChild(b);
    }
    if(type!=='tag'){
      add(it.pinned?'📌 Desfijar':'📌 Fijar',function(){it.pinned=!it.pinned;closeCtx();toast(it.pinned?'Fijado':'Desfijado')});
      add(it.fav?'★ Quitar de favoritos':'★ Favorito',function(){it.fav=!it.fav;closeCtx();toast('Guardado')});
      ctx.appendChild(document.createElement('hr'));
    }
    if(type==='note'){
      add('✏️ Renombrar',function(){closeCtx();showRename(type,it,'title')});
      add('🎨 Cambiar hoja',function(){it.sheet=((it.sheet||0)+1)%SHEETS.length;if(currentNote===it)applySheet();closeCtx();toast('Hoja cambiada')});
    }else{
      add('🎨 Personalizar',function(){closeCtx();showForm(type,it)});
    }
    ctx.appendChild(document.createElement('hr'));
    add('🗑 Eliminar',function(b){
      if(!armedDel){armedDel=true;b.textContent='¿Confirmar eliminación?';return}
      arr.splice(arr.indexOf(it),1);db.trash.push({type:type,item:it});closeCtx();toast('Enviado a la papelera');
    },true);
    ctx.classList.add('show');
    placeCtx(x,y,anchor||null);
  }

  var overlay=$('#overlay'),modal=$('#modal');
  function closeOverlay(){overlay.classList.remove('show')}
  overlay.addEventListener('pointerdown',function(e){if(e.target===overlay)closeOverlay()});

  function showCreateChooser(){
    modal.innerHTML='<h3 style="margin-bottom:12px">¿Qué quieres crear?</h3>'+
      '<button class="opt" id="new-folder">📁 Nueva carpeta</button>'+
      '<button class="opt" id="new-tag">🏷 Nueva etiqueta</button>'+
      '<div class="m-actions"><button class="btn-ghost" id="m-cancel">Cancelar</button></div>';
    overlay.classList.add('show');
    $('#new-folder').onclick=function(){showForm('folder')};
    $('#new-tag').onclick=function(){showForm('tag')};
    $('#m-cancel').onclick=closeOverlay;
  }

  function createNote(){
    var folder=actF==='all'?(db.folders[0]?db.folders[0].id:null):actF;
    if(folder===null){
      closeOverlay();toast('Crea una carpeta primero');showForm('folder');return;
    }
    var n={id:uid(),folder:folder,tags:Array.from(actTags),title:'Nota nueva',pinned:false,fav:false,sheet:0,
      updated:Date.now(),blocks:[{id:uid(),type:'text',data:''}]};
    db.notes.unshift(n);save();viewMode='home';render();closeOverlay();openNote(n.id);
  }

  function showQuickCreateChooser(){
    modal.innerHTML='<div class="create-head"><div class="create-preview">＋</div>'+
      '<div class="create-copy"><h3>Crear en OANIX</h3><p>Elige qué quieres añadir.</p></div></div>'+
      '<button class="opt" id="quick-note">📝 Nueva nota</button>'+
      '<button class="opt" id="quick-folder">📁 Nueva carpeta</button>'+
      '<button class="opt" id="quick-tag">🏷 Nueva etiqueta</button>'+
      '<div class="m-actions"><button class="btn-ghost" id="m-cancel">Cancelar</button></div>';
    overlay.classList.add('show');
    $('#quick-note').onclick=createNote;
    $('#quick-folder').onclick=function(){showForm('folder')};
    $('#quick-tag').onclick=function(){showForm('tag')};
    $('#m-cancel').onclick=closeOverlay;
  }

  function showMoveChooser(){
    modal.innerHTML='<h3 style="margin-bottom:6px">¿Qué quieres mover?</h3>'+
      '<p class="reorder-note">Después podrás arrastrar libremente los elementos usando el control ≡.</p>'+
      '<button class="opt" id="move-folder" style="margin-top:14px">📁 Reordenar carpetas</button>'+
      '<button class="opt" id="move-tag">🏷 Reordenar etiquetas</button>'+
      '<div class="m-actions"><button class="btn-ghost" id="m-cancel">Cancelar</button></div>';
    overlay.classList.add('show');
    $('#move-folder').onclick=function(){showReorder('folder')};
    $('#move-tag').onclick=function(){showReorder('tag')};
    $('#m-cancel').onclick=closeOverlay;
  }

  var reorderState=null;
  function reorderRow(type,item){
    return '<div class="reorder-item" data-reorder-id="'+item.id+'">'+
      '<span class="r-icon">'+(type==='folder'?item.icon:'<span class="sdot" style="display:inline-block;background:'+grad(item.ci)+'"></span>')+'</span>'+
      '<span class="r-name">'+esc(item.name)+'</span>'+
      '<button class="reorder-handle" type="button" title="Mantén y arrastra" aria-label="Mover '+esc(item.name)+'">≡</button></div>';
  }
  function showReorder(type){
    var arr=db[type+'s'];
    modal.innerHTML='<h3 style="margin-bottom:6px">'+(type==='folder'?'Ordenar carpetas':'Ordenar etiquetas')+'</h3>'+
      '<p class="reorder-note">Arrastra con ≡ hasta la posición que quieras.</p>'+
      '<div class="reorder-list" id="reorder-list" data-reorder-type="'+type+'">'+arr.map(function(it){return reorderRow(type,it)}).join('')+'</div>'+
      '<div class="m-actions"><button class="btn-primary" id="m-done">Listo</button></div>';
    overlay.classList.add('show');
    $('#m-done').onclick=function(){closeOverlay();render();toast('Orden guardado')};
  }
  modal.addEventListener('pointerdown',function(e){
    var handle=e.target.closest('.reorder-handle');
    if(!handle)return;
    var item=handle.closest('.reorder-item'),list=handle.closest('.reorder-list');
    if(!item||!list)return;
    e.preventDefault();
    reorderState={item:item,list:list,pointerId:e.pointerId};
    item.classList.add('dragging');
    document.body.classList.add('is-dragging');
    try{handle.setPointerCapture(e.pointerId)}catch(err){}
  });
  modal.addEventListener('pointermove',function(e){
    if(!reorderState||e.pointerId!==reorderState.pointerId)return;
    e.preventDefault();
    var list=reorderState.list,item=reorderState.item;
    var lr=list.getBoundingClientRect();
    if(e.clientY<lr.top+42)list.scrollTop-=12;
    else if(e.clientY>lr.bottom-42)list.scrollTop+=12;
    var under=document.elementFromPoint(e.clientX,e.clientY);
    var target=under&&under.closest?under.closest('.reorder-item'):null;
    if(!target||target===item||target.parentElement!==list)return;
    var r=target.getBoundingClientRect();
    if(e.clientY<r.top+r.height/2)list.insertBefore(item,target);
    else list.insertBefore(item,target.nextSibling);
  },{passive:false});
  function finishReorder(e){
    if(!reorderState||e.pointerId!==reorderState.pointerId)return;
    var list=reorderState.list,item=reorderState.item;
    item.classList.remove('dragging');
    document.body.classList.remove('is-dragging');
    var ids=Array.from(list.querySelectorAll('.reorder-item')).map(function(el){return +el.dataset.reorderId});
    var type=list.dataset.reorderType;
    var arr=db[type+'s'];
    var ordered=ids.map(function(id){return arr.find(function(it){return it.id===id})}).filter(Boolean);
    if(ordered.length===arr.length)arr.splice.apply(arr,[0,arr.length].concat(ordered));
    save();render();reorderState=null;toast('Orden actualizado');
  }
  modal.addEventListener('pointerup',finishReorder);
  modal.addEventListener('pointercancel',finishReorder);

  function showForm(type,editing){
    var isF=type==='folder';
    var selI=editing&&editing.icon?editing.icon:ICONS[0],selC=editing?editing.ci:0;
    var html='<div class="create-head"><div class="create-preview" id="m-preview" style="background:'+grad(selC)+'">'+(isF?selI:'#')+'</div>'+
      '<div class="create-copy"><h3>'+(editing?'Personalizar '+(isF?'carpeta':'etiqueta'):(isF?'Nueva carpeta':'Nueva etiqueta'))+'</h3>'+
      '<p>'+(isF?'Organiza tus notas en un espacio propio':'Agrupa y encuentra contenido rápidamente')+'</p></div></div>'+
      '<input id="m-name" maxlength="24" placeholder="'+(isF?'Nombre de la carpeta':'Nombre de la etiqueta')+'" value="'+(editing?esc(editing.name):'')+'"/>';
    if(isF){
      html+='<div class="m-label">Icono</div><div class="icon-row">'+ICONS.map(function(i){
        return '<button class="ic '+(i===selI?'sel':'')+'" data-ic="'+i+'">'+i+'</button>';
      }).join('')+'</div>';
    }
    html+='<div class="m-label">Color</div><div class="swatch-row">'+PALETTE.map(function(p,i){
      return '<button class="sw '+(i===selC?'sel':'')+'" data-ci="'+i+'" style="background:linear-gradient(135deg,'+p[0]+','+p[1]+')"></button>';
    }).join('')+'</div>'+
      '<div class="m-actions"><button class="btn-ghost" id="m-cancel">Cancelar</button>'+
      '<button class="btn-primary" id="m-save">'+(editing?'Guardar':'Crear')+'</button></div>';
    modal.innerHTML=html;overlay.classList.add('show');$('#m-name').focus();

    modal.querySelectorAll('.ic').forEach(function(b){b.onclick=function(){
      selI=b.dataset.ic;modal.querySelectorAll('.ic').forEach(function(x){x.classList.toggle('sel',x===b)});
      var p=$('#m-preview');if(p)p.textContent=selI;
    }});
    modal.querySelectorAll('.sw').forEach(function(b){b.onclick=function(){
      selC=+b.dataset.ci;modal.querySelectorAll('.sw').forEach(function(x){x.classList.toggle('sel',x===b)});
      var p=$('#m-preview');if(p)p.style.background=grad(selC);
    }});
    $('#m-cancel').onclick=closeOverlay;
    $('#m-save').onclick=function(){
      var name=$('#m-name').value.trim();if(!name){toast('Escribe un nombre');return}
      if(editing){
        editing.name=name;editing.ci=selC;if(isF)editing.icon=selI;toast('Guardado');
      }else{
        var item={id:uid(),name:name,ci:selC,pinned:false,fav:false};
        if(isF){item.icon=selI;db.folders.push(item)}else db.tags.push(item);
        toast(isF?'Carpeta creada':'Etiqueta creada');
      }
      save();render();closeOverlay();
    };
  }
  function showRename(type,it,key){
    modal.innerHTML='<h3>Renombrar</h3><input id="m-name" maxlength="40" value="'+esc(it[key])+'"/>'+
      '<div class="m-actions"><button class="btn-ghost" id="m-cancel">Cancelar</button><button class="btn-primary" id="m-save">Guardar</button></div>';
    overlay.classList.add('show');var inp=$('#m-name');inp.focus();inp.select();
    $('#m-cancel').onclick=closeOverlay;
    $('#m-save').onclick=function(){var v=inp.value.trim();if(!v){toast('Escribe un nombre');return}it[key]=v;save();render();closeOverlay();toast('Renombrado')};
  }
  function showTrash(){
    var ic={folder:'📁',tag:'🏷',note:'📝'};
    var html='<h3 style="margin-bottom:14px">🗑 Papelera</h3>';
    if(db.trash.length){
      html+=db.trash.map(function(t,i){
        return '<div class="opt" style="justify-content:space-between;align-items:center"><span>'+ic[t.type]+' '+esc(t.item.name||t.item.title||'')+'</span>'+
          '<span style="display:flex;gap:6px"><button class="btn-ghost" data-restore="'+i+'" style="padding:6px 10px">Restaurar</button>'+
          '<button class="btn-ghost" data-kill="'+i+'" style="padding:6px 10px;color:var(--danger)">Borrar</button></span></div>';
      }).join('');
    }else html+='<div class="empty">Papelera vacía.</div>';
    html+='<div class="m-actions"><button class="btn-ghost" id="m-cancel">Cerrar</button></div>';
    modal.innerHTML=html;overlay.classList.add('show');$('#m-cancel').onclick=closeOverlay;
    modal.querySelectorAll('[data-restore]').forEach(function(b){b.onclick=function(){
      var i=+b.dataset.restore,t=db.trash[i];(t.type==='note'?db.notes:t.type==='folder'?db.folders:db.tags).push(t.item);
      db.trash.splice(i,1);save();render();showTrash();toast('Restaurado');
    }});
    modal.querySelectorAll('[data-kill]').forEach(function(b){b.onclick=function(){db.trash.splice(+b.dataset.kill,1);save();showTrash();toast('Eliminado definitivo')}});
  }

  document.addEventListener('pointerdown',function(e){
    if(ctx.classList.contains('show')&&!e.target.closest('#ctx')&&!e.target.closest('[data-kebab]'))closeCtx();
  });
  document.addEventListener('click',function(e){
    var k=e.target.closest('[data-kebab]');
    if(k){e.preventDefault();e.stopPropagation();var p=k.dataset.kebab.split(':'),r=k.getBoundingClientRect();openCtx(p[0],+p[1],r.left,r.bottom+4,r);return}
    var o=e.target.closest('[data-open]');
    if(o){var p2=o.dataset.open.split(':');if(p2[0]==='note')openNote(+p2[1])}
  });
  document.addEventListener('contextmenu',function(e){
    var t=e.target.closest('[data-ctx]');if(t){e.preventDefault();var p=t.dataset.ctx.split(':');openCtx(p[0],+p[1],e.clientX,e.clientY)}
  });

  function toggleSearch(){
    var tb=document.querySelector('.topbar');
    if(matchMedia('(max-width:900px)').matches){tb.classList.toggle('searching');if(tb.classList.contains('searching'))$('#search').focus()}
    else $('#search').focus();
  }
  $('#t-search').onclick=toggleSearch;
  $('#search').addEventListener('input',function(e){q=e.target.value.toLowerCase();renderList()});
  $('#search').addEventListener('blur',function(){document.querySelector('.topbar').classList.remove('searching')});
  $('#t-user').onclick=function(){toast('Perfil: próximamente')};

  var SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function applyTheme(light){document.body.classList.toggle('light',light);$('#t-theme').innerHTML=light?SUN:MOON;localStorage.setItem('oanix-theme',light?'light':'dark')}
  applyTheme(localStorage.getItem('oanix-theme')==='light');
  $('#t-theme').onclick=function(){applyTheme(!document.body.classList.contains('light'))};

  var sidebar=$('#sidebar'),scrim=$('#scrim'),drawerHistory=false;
  function closeDrawer(fromHistory){
    sidebar.classList.remove('open');scrim.classList.remove('show');document.body.classList.remove('drawer-open');closeCtx();
    if(!fromHistory&&drawerHistory&&history.state&&history.state.oanixDrawer){
      drawerHistory=false;history.back();
    }else if(fromHistory){drawerHistory=false}
  }
  function openDrawer(){
    if(sidebar.classList.contains('open'))return;
    sidebar.classList.add('open');scrim.classList.add('show');document.body.classList.add('drawer-open');closeCtx();
    if(!(history.state&&history.state.oanixDrawer)){
      history.pushState({oanixDrawer:true},'');
      drawerHistory=true;
    }
  }
  $('#menu-btn').onclick=openDrawer;
  $('#side-close').onclick=function(){closeDrawer(false)};
  scrim.onclick=function(){closeDrawer(false)};
  addEventListener('popstate',function(){
    if(sidebar.classList.contains('open'))closeDrawer(true);
  });
  $('#side-create').onclick=showCreateChooser;
  $('#side-move').onclick=showMoveChooser;

  $('#fab').onclick=showQuickCreateChooser;
  document.querySelectorAll('.bnav .nb').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('.bnav .nb').forEach(function(x){x.classList.remove('active')});b.classList.add('active');
    var n=b.dataset.nav;
    if(n==='home'){
      viewMode='home';actF='all';actTags.clear();q='';$('#search').value='';
      renderTabs();renderStrip();renderList();wrap.scrollTo({top:0,behavior:'smooth'});
    }
    if(n==='search')toggleSearch();
    if(n==='recents'){
      viewMode='recents';actF='all';actTags.clear();q='';$('#search').value='';
      renderTabs();renderStrip();renderList();wrap.scrollTo({top:0,behavior:'smooth'});
    }
    if(n==='settings')toast('Ajustes: próximamente');
  }});
  addEventListener('keydown',function(e){if(e.key==='Escape'){closeCtx();closeOverlay();closeDrawer();document.querySelector('.topbar').classList.remove('searching')}});
})();
</script>
</body>
</html>

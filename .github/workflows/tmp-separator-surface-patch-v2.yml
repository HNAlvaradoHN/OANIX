name: Temporary Separator Surface Patch v2

on:
  push:
    branches: ['feat/oanix-separator-block-2026-09-04']
    paths: ['.github/workflows/tmp-separator-surface-patch-v2.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oanix-separator-block-2026-09-04
      - name: Apply verified separator wiring
        run: python scripts/tmp-patch-separator-surface.py
      - name: Commit patched surface
        run: |
          git config user.name "OANIX automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/editor/implementations/OanixNotesSheetSurface.tsx
          git diff --cached --check
          git commit -m "feat: wire separator into OANIX Notes surface"
          git push origin HEAD:feat/oanix-separator-block-2026-09-04

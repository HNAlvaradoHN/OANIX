name: Apply V1 checklists

on:
  push:
    branches:
      - agent/v1-checklists

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-checklists
      - name: Apply implementation
        run: python .github/apply_checklists.py
      - name: Remove temporary patch files
        run: |
          rm .github/apply_checklists.py
          rm .github/workflows/apply-checklists.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: add encrypted checklist blocks"
          git push origin agent/v1-checklists

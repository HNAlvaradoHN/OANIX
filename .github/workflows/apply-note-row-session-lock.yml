name: Apply note-row session lock

on:
  push:
    branches: [fix/note-row-session-lock]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[note-row-lock-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/note-row-session-lock
          fetch-depth: 0

      - name: Apply note-row session lock and continuity docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime_path = Path('src/features/privacy/NotePrivacyRuntime.tsx')
          runtime = runtime_path.read_text()

          old_host = """  const noteIdentityHost = useMemo(() => {
    void domRevision
    return document.querySelector<HTMLElement>('.note-view__identity')
  }, [domRevision])
"""
          new_host = """  const rowPrivacyHosts = useMemo(() => {
    void domRevision
    return Array.from(document.querySelectorAll<HTMLElement>('.note-row[data-reorder-note-id]')).flatMap((host) => {
      const noteId = host.dataset.reorderNoteId
      return noteId ? [{ host, noteId }] : []
    })
  }, [domRevision])
"""
          if old_host not in runtime:
              raise SystemExit('noteIdentityHost anchor not found')
          runtime = runtime.replace(old_host, new_host, 1)

          row_dataset = """      row.dataset.oanixNoteLocked = locked ? 'true' : 'false'
      row.dataset.oanixPrivateNote = privacy?.privateBox === true ? 'true' : 'false'
"""
          row_dataset_new = """      row.dataset.oanixNoteLocked = locked ? 'true' : 'false'
      row.dataset.oanixNoteHasLock = privacy?.lock ? 'true' : 'false'
      row.dataset.oanixPrivateNote = privacy?.privateBox === true ? 'true' : 'false'
"""
          if row_dataset not in runtime:
              raise SystemExit('row dataset anchor not found')
          runtime = runtime.replace(row_dataset, row_dataset_new, 1)

          old_relock = """  function manuallyRelockNote(noteId: string) {
    const focused = document.activeElement
    const noteView = document.querySelector<HTMLElement>('.note-view')
    if (focused instanceof HTMLElement && noteView?.contains(focused)) focused.blur()

    setUnlockedNoteIds((current) => {
      const next = new Set(current)
      next.delete(noteId)
      return next
    })
  }
"""
          new_relock = """  function manuallyRelockNote(noteId: string) {
    const focused = document.activeElement
    const noteView = document.querySelector<HTMLElement>('.note-view')
    const relockingSelectedNote = selectedNoteIdFromDom() === noteId
    if (relockingSelectedNote && focused instanceof HTMLElement && noteView?.contains(focused)) focused.blur()

    setUnlockedNoteIds((current) => {
      const next = new Set(current)
      next.delete(noteId)
      return next
    })
  }
"""
          if old_relock not in runtime:
              raise SystemExit('manual relock anchor not found')
          runtime = runtime.replace(old_relock, new_relock, 1)

          old_portal = """      {noteIdentityHost && selectedNoteId && selectedPrivacy?.lock && createPortal(
        <button
          className={`oanix-note-session-lock${unlockedNoteIds.has(selectedNoteId) ? ' oanix-note-session-lock--unlocked' : ''}`}
          type=\"button\"
          aria-label={unlockedNoteIds.has(selectedNoteId) ? 'Bloquear esta nota ahora' : 'Desbloquear esta nota'}
          title={unlockedNoteIds.has(selectedNoteId) ? 'Bloquear nota ahora' : 'Desbloquear nota'}
          disabled={selectedNeedsPrivateAuth}
          onClick={() => {
            if (unlockedNoteIds.has(selectedNoteId)) {
              manuallyRelockNote(selectedNoteId)
              return
            }
            if (!selectedNeedsPrivateAuth) openLockDialog('unlock', selectedNoteId)
          }}
        >
          <span aria-hidden=\"true\">{unlockedNoteIds.has(selectedNoteId) ? '🔓' : '🔒'}</span>
        </button>,
        noteIdentityHost,
      )}
"""
          new_portal = """      {rowPrivacyHosts.map(({ host, noteId }) => {
        const privacy = privacyById.get(noteId)
        if (!privacy?.lock) return null
        const isUnlocked = unlockedNoteIds.has(noteId)
        return createPortal(
          <button
            className={`oanix-note-row-lock${isUnlocked ? ' oanix-note-row-lock--unlocked' : ''}`}
            type=\"button\"
            aria-label={isUnlocked ? 'Bloquear esta nota ahora' : 'Desbloquear esta nota'}
            title={isUnlocked ? 'Bloquear nota ahora' : 'Desbloquear nota'}
            onClick={(event) => {
              event.preventDefault()
              event.stopPropagation()
              if (isUnlocked) {
                manuallyRelockNote(noteId)
                return
              }
              openLockDialog('unlock', noteId)
            }}
          >
            <svg className=\"oanix-note-row-lock__icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">
              <rect x=\"5.5\" y=\"10\" width=\"13\" height=\"10\" rx=\"2.4\" />
              {isUnlocked ? (
                <path d=\"M9 10V7.8a4 4 0 0 1 7.7-1.5\" />
              ) : (
                <path d=\"M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10\" />
              )}
              <path d=\"M12 14v2.4\" />
            </svg>
          </button>,
          host,
          `note-row-lock-${noteId}`,
        )
      })}
"""
          if old_portal not in runtime:
              raise SystemExit('old note identity lock portal not found')
          runtime = runtime.replace(old_portal, new_portal, 1)
          runtime_path.write_text(runtime)

          css_path = Path('src/features/privacy/manualNoteRelock.css')
          css_path.write_text(""".note-view[data-oanix-note-has-lock='true'] .note-view__identity strong::after,
.note-row[data-oanix-note-has-lock='true'] .note-row__topline strong::after {
  content: none !important;
}

.note-row__open {
  order: 0;
}

.oanix-note-row-lock {
  order: 1;
  align-self: center;
  flex: 0 0 auto;
  width: 2rem;
  height: 2rem;
  display: grid;
  place-items: center;
  margin: 0 .02rem 0 .08rem;
  padding: 0;
  border: 1px solid transparent;
  border-radius: .62rem;
  background: transparent;
  color: var(--theme-text-muted, #94a3b8);
  cursor: pointer;
  touch-action: manipulation;
  transition: color .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease, transform .14s ease;
}

.oanix-note-row-lock__icon {
  width: 1.05rem;
  height: 1.05rem;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.oanix-note-row-lock:hover,
.oanix-note-row-lock:focus-visible {
  outline: none;
  color: var(--theme-accent, #8d7aff);
  border-color: color-mix(in srgb, var(--theme-accent, #8d7aff) 28%, transparent);
  background: color-mix(in srgb, var(--theme-accent, #8d7aff) 8%, transparent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--theme-accent, #8d7aff) 8%, transparent);
}

.oanix-note-row-lock:active {
  transform: scale(.94);
}

.oanix-note-row-lock--unlocked {
  color: var(--theme-accent-2, #67e8f9);
}

.oanix-note-row-lock--unlocked:hover,
.oanix-note-row-lock--unlocked:focus-visible {
  color: var(--theme-accent-2, #67e8f9);
  border-color: color-mix(in srgb, var(--theme-accent-2, #67e8f9) 30%, transparent);
  background: color-mix(in srgb, var(--theme-accent-2, #67e8f9) 8%, transparent);
}

.note-row__menu-wrap {
  order: 2;
  flex: 0 0 auto;
}

@media (max-width: 420px) {
  .oanix-note-row-lock {
    width: 1.9rem;
    height: 1.9rem;
    margin-left: 0;
  }

  .oanix-note-row-lock__icon {
    width: 1rem;
    height: 1rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .oanix-note-row-lock {
    transition: none;
  }
}
""")

          test_path = Path('tests/manualNoteRelock.test.ts')
          test_path.write_text("""import assert from 'node:assert/strict'
import { readFileSync } from 'node:fs'
import test from 'node:test'

const runtimeSource = readFileSync('src/features/privacy/NotePrivacyRuntime.tsx', 'utf8')
const styleSource = readFileSync('src/features/privacy/manualNoteRelock.css', 'utf8')
const notesStyleSource = readFileSync('src/features/notes/notes.css', 'utf8')

test('protected note session lock lives in the note row and reuses the existing in-memory unlock set', () => {
  assert.match(runtimeSource, /const rowPrivacyHosts = useMemo/)
  assert.match(runtimeSource, /\.note-row\[data-reorder-note-id\]/)
  assert.match(runtimeSource, /if \(!privacy\?\.lock\) return null/)
  assert.match(runtimeSource, /const isUnlocked = unlockedNoteIds\.has\(noteId\)/)
  assert.match(runtimeSource, /className=\{`oanix-note-row-lock/)
  assert.match(runtimeSource, /Bloquear esta nota ahora/)
  assert.match(runtimeSource, /Desbloquear esta nota/)
  assert.doesNotMatch(runtimeSource, /className=\{`oanix-note-session-lock/)
})

test('row lock click cannot accidentally open the note and locked state uses the existing dialog', () => {
  assert.match(runtimeSource, /event\.preventDefault\(\)/)
  assert.match(runtimeSource, /event\.stopPropagation\(\)/)
  assert.match(runtimeSource, /manuallyRelockNote\(noteId\)/)
  assert.match(runtimeSource, /openLockDialog\('unlock', noteId\)/)
})

test('manual relock only clears ephemeral authorization and only blurs the selected note editor', () => {
  const relockBody = runtimeSource.match(/function manuallyRelockNote[\s\S]*?(?=\n  function openLockDialog)/)?.[0] ?? ''
  assert.ok(relockBody.length > 0)
  assert.match(relockBody, /selectedNoteIdFromDom\(\) === noteId/)
  assert.match(relockBody, /next\.delete\(noteId\)/)
  assert.doesNotMatch(relockBody, /setNotePrivacyLock|setNotePrivateBox|createNotePrivacyLock|localStorage|sessionStorage/)
})

test('explicit row lock replaces duplicate pseudo locks and keeps list title ellipsis intact', () => {
  assert.match(runtimeSource, /dataset\.oanixNoteHasLock/)
  assert.match(styleSource, /note-row\[data-oanix-note-has-lock='true'\]/)
  assert.match(styleSource, /\.oanix-note-row-lock/)
  assert.match(styleSource, /flex: 0 0 auto/)
  assert.match(styleSource, /var\(--theme-accent/)
  assert.match(styleSource, /prefers-reduced-motion/)
  assert.match(notesStyleSource, /\.note-row__open[\s\S]*?min-width: 0/)
  assert.match(notesStyleSource, /\.note-row__topline strong[^}]*overflow: hidden[^}]*text-overflow: ellipsis[^}]*white-space: nowrap/)
  assert.match(notesStyleSource, /\.note-row__topline time \{ flex: 0 0 auto/)
})
""")

          memory_path = Path('docs/PROJECT_MEMORY.md')
          memory = memory_path.read_text()
          marker = '### Continuidad 2026-08-18 — candado de sesión en la tarjeta de nota'
          if marker not in memory:
              memory += """

---

### Continuidad 2026-08-18 — candado de sesión en la tarjeta de nota
**Estado:** IMPLEMENTED / VALIDATION_DEBT

- El PR #133 introdujo el bloqueo manual de una nota protegida durante la sesión: `unlockedNoteIds` sigue siendo el único estado efímero de autorización; `manuallyRelockNote(noteId)` solo elimina ese ID y no modifica código, PBKDF2, metadatos cifrados, sync ni Caja privada.
- Ajuste posterior solicitado por el usuario: el control visible `bloqueado/desbloqueado` debe vivir en la burbuja/tarjeta de la nota de la lista, no junto al título grande de la vista abierta.
- Implementación elegida: portal desde `NotePrivacyRuntime` directamente sobre cada `.note-row`, como hermano de `.note-row__open` y antes visualmente del menú `⋮`. No se introduce estado nuevo en `NotesWorkspace` ni un componente paralelo de privacidad.
- El icono usa SVG `currentColor` y tokens del tema; el título existente conserva `min-width: 0` + ellipsis y cede espacio al candado/menú sin superposición.
- El candado explícito sustituye los pseudo-candados redundantes de título. Nota sin protección: sin candado. Protegida bloqueada: candado cerrado. Protegida desbloqueada: candado abierto; tocarlo vuelve a bloquear solo en memoria.
- Corrección asociada: relock de una nota distinta de la seleccionada ya no debe desenfocar el editor activo; el `blur()` solo aplica cuando se relockea la nota actualmente abierta.
- Validación automática requerida: node:test + build web + Android. Validación física restante: comprobar en APK que el icono cabe en tarjetas con títulos largos y que `cerrado -> código -> abierto -> cerrar` funciona sin abrir accidentalmente la nota.
- Issue de privacidad relacionado: #68. No cerrarlo hasta completar la prueba física final.
"""
              memory_path.write_text(memory)

          changelog_path = Path('docs/CHANGELOG.md')
          changelog = changelog_path.read_text()
          changelog_marker = 'Candado de sesión integrado en la tarjeta de nota'
          if changelog_marker not in changelog:
              changelog += """

## 2026-08-18 — Candado de sesión integrado en la tarjeta de nota
- Mueve el control manual de relock de PR #133 desde el encabezado de la nota abierta hacia cada tarjeta protegida de la lista.
- Mantiene `unlockedNoteIds` como única autorización temporal y no cambia persistencia, cifrado, PBKDF2, Caja privada ni sincronización.
- Añade icono SVG temático discreto, evita pseudo-candados duplicados y conserva ellipsis de títulos largos.
- Evita desenfocar el editor cuando se relockea desde la lista una nota distinta de la actualmente abierta.
- Añade regresiones con `node:test` para ubicación, propagación de eventos, no persistencia y contrato visual.
"""
              changelog_path.write_text(changelog)

          roadmap_path = Path('docs/ROADMAP.md')
          roadmap = roadmap_path.read_text()
          roadmap_marker = 'Checkpoint RC 2026-08-18 — privacidad por nota'
          if roadmap_marker not in roadmap:
              roadmap += """

### Checkpoint RC 2026-08-18 — privacidad por nota
- Protección individual y Caja privada están implementadas; issue #68 permanece en VALIDATION_DEBT hasta prueba física final Android.
- PR #133 añadió relock manual de sesión. El ajuste visual posterior coloca el candado de sesión en la tarjeta de la lista manteniendo el mismo estado en memoria y sin ampliar alcance funcional.
- Después de validar físicamente este bloque, cerrar #68 y continuar con las deudas RC ya registradas; no abrir funciones nuevas por este ajuste visual.
"""
              roadmap_path.write_text(roadmap)

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text()
          replacement = """## Estado de continuidad actual

A fecha de **2026-08-18**:

- V1 — Núcleo local: cerrada.
- V2 — Cuenta y sincronización: cerrada funcionalmente; continúan deudas de validación visibles, especialmente #69, #70 y #73.
- V3 — Android con Capacitor: cerrada formalmente en #79. La continuidad de firma debug estable quedó validada mediante actualización APK real sin desinstalar; la firma definitiva de Play Store sigue separada.
- Rediseño/pulido visual post-V3: dirección aprobada y ya integrada en `main`, con sistema de temas/personalización y pulidos de tarjetas/menús.
- Privacidad de uso diario: protección por nota + Caja privada implementadas. PR #133 añadió relock manual de sesión; el ajuste posterior mueve el candado visible a la tarjeta de la lista. #68 no se cierra hasta validación física final.
- Deuda Android diferida: #105, huella puede tardar 2–3 cold starts; resolver en pulido Android/RC sin debilitar biometría.
- Bloque RC siguiente después de privacidad: continuar validaciones pendientes registradas en issues/ROADMAP, con especial atención a conflictos #69.
- No introducir funciones de V4 ni monetización/OANIX Pro mientras se cierra el RC.

La especificación exacta, decisiones y deudas vigentes están en `docs/PROJECT_MEMORY.md`, `docs/ROADMAP.md` y los issues correspondientes.

"""
          agents_new, count = re.subn(
              r"## Estado de continuidad actual\n[\s\S]*?(?=## Regla especial de traspaso entre IAs)",
              replacement,
              agents,
              count=1,
          )
          if count != 1:
              raise SystemExit('AGENTS continuity block not found')
          agents_path.write_text(agents_new)

          workflow = Path('.github/workflows/apply-note-row-session-lock.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Privacy: move session lock into note cards [note-row-lock-applied]"
          git push origin HEAD:fix/note-row-session-lock

name: Apply folder arrow navigation

on:
  push:
    branches:
      - agent/v1-folder-arrows
    paths:
      - .github/apply_folder_arrows.py
      - .github/workflows/apply-folder-arrows.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-folder-arrows
      - name: Apply implementation
        run: python .github/apply_folder_arrows.py
      - name: Remove temporary patch files
        run: rm .github/apply_folder_arrows.py .github/workflows/apply-folder-arrows.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: add dedicated folder navigation arrows"
          git push origin HEAD:agent/v1-folder-arrows

name: Temporary Aurora mobile hardening

on:
  push:
    branches: [feat/aurora-native-note-sheet]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply safeguards
        run: python scripts/temporary_aurora_harden.py
      - name: Test
        run: |
          npm ci
          npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/temporary-aurora-mobile-hardening.yml scripts/temporary_aurora_harden.py
          git add -A
          git commit -m "fix: preserve mobile note safeguards in Aurora"
          git push origin HEAD:feat/aurora-native-note-sheet

name: Temporary Aurora mobile hardening

on:
  push:
    branches:
      - feat/aurora-native-note-sheet

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[aurora-mobile-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Aurora-native mobile safeguards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python <<'PY'
          from pathlib import Path

          sheet_path = Path('src/features/notes/themes/aurora-native/AuroraNativeNoteSheet.tsx')
          sheet = sheet_path.read_text()

          sheet = sheet.replace(
              "  const stageRef = useRef<HTMLDivElement>(null)\n  const pointersRef = useRef(new Map<number, { x: number; y: number }>())",
              "  const stageRef = useRef<HTMLDivElement>(null)\n  const imageRef = useRef<HTMLImageElement>(null)\n  const pointersRef = useRef(new Map<number, { x: number; y: number }>())",
              1,
          )
          sheet = sheet.replace(
              "  const [scale, setScale] = useState(1)\n  const [offset, setOffset] = useState({ x: 0, y: 0 })",
              "  const [scale, setScale] = useState(1)\n  const [baseWidth, setBaseWidth] = useState<number | null>(null)\n  const [offset, setOffset] = useState({ x: 0, y: 0 })",
              1,
          )
          old_image = """        <img
          src={state.src}
          alt=""
          draggable={false}
          style={{ transform: `translate(${offset.x}px,${offset.y}px) scale(${scale})` }}
        />"""
          new_image = """        <img
          ref={imageRef}
          src={state.src}
          alt=""
          draggable={false}
          onLoad={() => {
            const width = imageRef.current?.getBoundingClientRect().width ?? 0
            if (width > 0) setBaseWidth(width)
          }}
          style={{
            width: baseWidth ? `${Math.round(baseWidth * scale)}px` : undefined,
            maxWidth: baseWidth ? 'none' : undefined,
            maxHeight: baseWidth ? 'none' : undefined,
            height: 'auto',
            transform: `translate(${offset.x}px,${offset.y}px)`,
          }}
        />"""
          if old_image not in sheet:
              raise SystemExit('Native lightbox image markup changed unexpectedly')
          sheet = sheet.replace(old_image, new_image, 1)

          sheet = sheet.replace(
              "  const [imageSelection, setImageSelection] = useState<ImageSelection | null>(null)\n  const [imageBarPosition, setImageBarPosition] = useState<FixedPosition>({ top: 0, left: 0 })",
              "  const [imageSelection, setImageSelection] = useState<ImageSelection | null>(null)\n  const [imageActionsOpen, setImageActionsOpen] = useState(false)\n  const [imageBarPosition, setImageBarPosition] = useState<FixedPosition>({ top: 0, left: 0 })",
              1,
          )
          effect_anchor = """  useEffect(() => {
    propsRef.current = props
  })"""
          # Do not depend on that exact effect existing; insert before the first blocksVersion use if needed.
          if "setImageActionsOpen(false)\n  }, [selectedBlockId])" not in sheet:
              marker = "  const selectedImageBlock = useMemo("
              idx = sheet.find(marker)
              if idx == -1:
                  raise SystemExit('selectedImageBlock marker not found')
              sheet = sheet[:idx] + "  useEffect(() => {\n    setImageActionsOpen(false)\n  }, [selectedBlockId])\n\n" + sheet[idx:]

          start = sheet.find("      {selectedImageBlock && imageSelection && (\n        <div\n          className={`imgbar")
          end_marker = "\n\n      <div\n        ref={bubbleRef}"
          end = sheet.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Image action bar block not found')
          old_bar = sheet[start:end]
          inner_start = old_bar.find("          <button type=\"button\" title=\"Abrir imagen\"")
          inner_end = old_bar.rfind("        </div>\n      )}")
          if inner_start == -1 or inner_end == -1:
              raise SystemExit('Image action bar inner content not found')
          actions = old_bar[inner_start:inner_end]
          new_bar = """      {selectedImageBlock && imageSelection && (
        <div
          className={`imgbar${selectedImageBlock.locked === false ? ' unlocked' : ''}${imageActionsOpen ? ' open' : ' compact'}`}
          style={imageBarPosition}
        >
          <button
            type="button"
            title="Acciones de la imagen"
            aria-label="Abrir acciones de la imagen"
            aria-expanded={imageActionsOpen}
            onClick={() => setImageActionsOpen((value) => !value)}
          ><Ellipsis /></button>
          {imageActionsOpen && <>
""" + actions + """
          </>}
        </div>
      )}"""
          sheet = sheet[:start] + new_bar + sheet[end:]

          sheet = sheet.replace(
              "            onContactChange={patchContact}\n            onOpenEmoji={(blockId, anchor) => setEmojiPop({ ...fixedNear(anchor, 248, 260), blockId })}",
              "            onContactChange={patchContact}\n            onOpenReader={(title, text) => setReader({ title, text, code: false })}\n            onOpenEmoji={(blockId, anchor) => setEmojiPop({ ...fixedNear(anchor, 248, 260), blockId })}",
              1,
          )
          sheet_path.write_text(sheet)

          blocks_path = Path('src/features/notes/themes/aurora-native/AuroraNativeBlocks.tsx')
          blocks = blocks_path.read_text()
          blocks = blocks.replace(
              "  onContactChange: (blockId: string, patch: Partial<ContactBlock>, rerender?: boolean) => void\n  onOpenEmoji: (blockId: string, anchor: DOMRect) => void",
              "  onContactChange: (blockId: string, patch: Partial<ContactBlock>, rerender?: boolean) => void\n  onOpenReader: (title: string, text: string) => void\n  onOpenEmoji: (blockId: string, anchor: DOMRect) => void",
              1,
          )
          blocks = blocks.replace(
              "  onContactChange,\n  onOpenEmoji,",
              "  onContactChange,\n  onOpenReader,\n  onOpenEmoji,",
              1,
          )
          old_field = """            <div className="c-field" key={field}>
              <span className="c-label">{label}</span>
              <UncontrolledEditable
                identity={`${block.id}:${field}`}
                resetToken={resetToken}
                className="c-value"
                text={value}
                editable={editable}
                onInput={(element) => onContactChange(block.id, { [field]: element.innerText } as Partial<ContactBlock>, true)}
              />
            </div>"""
          new_field = """            <div className={`c-field${field === 'notes' ? ' c-field-notes' : ''}`} key={field}>
              <span className="c-label">{label}</span>
              <UncontrolledEditable
                identity={`${block.id}:${field}`}
                resetToken={resetToken}
                className={`c-value${field === 'notes' ? ' c-notes-value' : ''}`}
                text={value}
                editable={editable}
                onInput={(element) => onContactChange(block.id, { [field]: element.innerText } as Partial<ContactBlock>, true)}
              />
              {field === 'notes' && value.trim() && !editing && (
                <button
                  className="c-notes-more"
                  type="button"
                  onClick={(event) => {
                    event.stopPropagation()
                    onOpenReader('Notas del contacto', value)
                  }}
                >Ver todo</button>
              )}
            </div>"""
          if old_field not in blocks:
              raise SystemExit('Contact field markup changed unexpectedly')
          blocks = blocks.replace(old_field, new_field, 1)
          blocks_path.write_text(blocks)

          css_path = Path('src/features/notes/themes/aurora-native/auroraNativeNoteSheet.css')
          css = css_path.read_text()
          css = css.replace(
              ".lb-stage img{max-width:92vw;max-height:78vh;user-select:none;-webkit-user-drag:none;transform-origin:center center;will-change:transform}",
              ".lb-stage img{max-width:92vw;max-height:78vh;user-select:none;-webkit-user-drag:none;transform-origin:center center}",
              1,
          )
          if '.c-field-notes{' not in css:
              contact_anchor = ".c-field span[contenteditable]{font-size:13.5px;border-radius:6px;padding:2px 5px;margin-left:-5px;display:inline-block;font-family:var(--f-body)}"
              contact_extra = """
.c-field-notes{grid-column:1/-1;min-width:0}
.c-notes-value:not([contenteditable='true']){display:-webkit-box!important;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-height:3.45em;line-height:1.72;white-space:normal;overflow-wrap:anywhere}
.c-notes-more{display:inline-flex;margin-top:4px;font-family:var(--f-mono);font-size:10.5px;color:var(--acc-deep);text-decoration:underline;text-underline-offset:3px}
.contact-card.editing .c-notes-value{display:inline-block!important;max-height:none;overflow:visible;-webkit-line-clamp:unset}
"""
              if contact_anchor not in css:
                  raise SystemExit('Contact CSS anchor changed unexpectedly')
              css = css.replace(contact_anchor, contact_anchor + contact_extra, 1)
          css_path.write_text(css)

          visual_path = Path('tests/noteOrganizerVisualRefresh.test.ts')
          visual = visual_path.read_text()
          visual = visual.replace(
              "  assert.match(notesWorkspace, /onClick=\\{\\(\\) => void flushPendingContent\\(\\)\\}/)\n  assert.match(auroraNativeSheet, /aria-label=\"Sincronizar y guardar nota ahora\"/)",
              "  assert.match(notesWorkspace, /onFlush=\\{flushPendingContent\\}/)\n  assert.match(auroraNativeSheet, /aria-label=\"Sincronizar y guardar nota ahora\"/)",
              1,
          )
          visual_path.write_text(visual)

          manual_path = Path('tests/manualNoteSaveAndMobileBlocks.test.ts')
          manual = manual_path.read_text()
          const_anchor = "const auroraSheetPath = new URL('../src/features/notes/themes/aurora-native/AuroraNativeNoteSheet.tsx', import.meta.url)"
          additions = "\nconst auroraBlocksPath = new URL('../src/features/notes/themes/aurora-native/AuroraNativeBlocks.tsx', import.meta.url)\nconst auroraCssPath = new URL('../src/features/notes/themes/aurora-native/auroraNativeNoteSheet.css', import.meta.url)"
          if 'const auroraBlocksPath' not in manual:
              manual = manual.replace(const_anchor, const_anchor + additions, 1)
          contact_marker = "  assert.match(css, /\\.pwa-contact-notes-more/)"
          if "c-notes-more" not in manual:
              manual = manual.replace(
                  "  const css = await readFile(previewCssPath, 'utf8')",
                  "  const css = await readFile(previewCssPath, 'utf8')\n  const auroraBlocks = await readFile(auroraBlocksPath, 'utf8')\n  const auroraCss = await readFile(auroraCssPath, 'utf8')",
                  1,
              )
              manual = manual.replace(contact_marker, contact_marker + "\n  assert.match(auroraBlocks, /c-notes-more/)\n  assert.match(auroraBlocks, /onOpenReader\\('Notas del contacto', value\\)/)\n  assert.match(auroraCss, /-webkit-line-clamp:2/)", 1)
          zoom_test_anchor = "test('PWA image zoom uses layout sizing instead of a giant transformed GPU layer', async () => {"
          if "baseWidth \\* scale" not in manual:
              idx = manual.find(zoom_test_anchor)
              if idx == -1:
                  raise SystemExit('Zoom test not found')
              css_read = "  const css = await readFile(previewCssPath, 'utf8')"
              pos = manual.find(css_read, idx)
              manual = manual[:pos] + css_read + "\n  const auroraSheet = await readFile(auroraSheetPath, 'utf8')\n  const auroraCss = await readFile(auroraCssPath, 'utf8')" + manual[pos + len(css_read):]
              assertion = "  assert.match(css, /img\\[data-pwa-zoom\\][\\s\\S]*transform: none !important/)"
              manual = manual.replace(assertion, assertion + "\n  assert.match(auroraSheet, /baseWidth \\* scale/)\n  assert.doesNotMatch(auroraSheet, /scale\\(\\$\\{scale\\}\\)/)\n  assert.doesNotMatch(auroraCss, /will-change:transform/)", 1)
          actions_anchor = "test('image actions require an explicit compact menu toggle', async () => {"
          if "imageActionsOpen" not in manual:
              idx = manual.find(actions_anchor)
              css_read = "  const css = await readFile(previewCssPath, 'utf8')"
              pos = manual.find(css_read, idx)
              manual = manual[:pos] + css_read + "\n  const auroraSheet = await readFile(auroraSheetPath, 'utf8')" + manual[pos + len(css_read):]
              assertion = "  assert.match(css, /\\.pwa-image-card__menu-toggle/)"
              manual = manual.replace(assertion, assertion + "\n  assert.match(auroraSheet, /imageActionsOpen/)\n  assert.match(auroraSheet, /aria-label=\"Abrir acciones de la imagen\"/)\n  assert.match(auroraSheet, /imageActionsOpen && <>/)", 1)
          manual_path.write_text(manual)

          Path('.github/workflows/temporary-aurora-mobile-hardening.yml').unlink()
          PY

      - name: Verify test suite
        run: |
          npm ci
          npm test

      - name: Commit hardened Aurora branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "fix: preserve mobile note safeguards in Aurora [aurora-mobile-done]"
          git push origin HEAD:feat/aurora-native-note-sheet

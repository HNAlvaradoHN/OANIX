name: Apply image drag polish

on:
  push:
    branches:
      - agent/v1-image-drag-checklists

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-image-drag-checklists
      - name: Apply implementation
        run: python .github/apply_image_drag_polish.py
      - name: Remove temporary patch files
        run: |
          rm .github/apply_image_drag_polish.py
          rm .github/workflows/apply-image-drag-polish.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: polish image alignment and drag interaction"
          git push origin agent/v1-image-drag-checklists

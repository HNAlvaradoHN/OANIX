name: Apply menu and caret follow-up

on:
  push:
    branches:
      - agent/v1-menu-caret-followup
    paths:
      - .github/scripts/apply_menu_caret_followup.py
      - .github/workflows/apply-menu-caret-followup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v1-menu-caret-followup
          fetch-depth: 0

      - name: Apply follow-up fixes
        run: python .github/scripts/apply_menu_caret_followup.py

      - name: Remove temporary patch files
        run: git rm .github/scripts/apply_menu_caret_followup.py .github/workflows/apply-menu-caret-followup.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: fix note menu placement and final image caret"
          git push origin HEAD:agent/v1-menu-caret-followup

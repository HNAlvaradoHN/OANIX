name: OANIX Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  build-android-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore stable debug signing key on main
        if: github.event_name == 'push'
        env:
          OANIX_DEBUG_KEYSTORE_BASE64: ${{ secrets.OANIX_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$OANIX_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Stable debug signing secret OANIX_DEBUG_KEYSTORE_BASE64 is required for main Android builds."
            exit 1
          fi
          printf '%s' "$OANIX_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/oanix-stable-debug.keystore"
          chmod 600 "$GITHUB_WORKSPACE/android/app/oanix-stable-debug.keystore"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Android web bundle
        run: npm run build:android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK and release AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

      - name: Verify stable debug APK signing certificate
        if: github.event_name == 'push'
        working-directory: android
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in ANDROID_HOME/build-tools."
            exit 1
          fi

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$CERT_OUTPUT"

          ACTUAL_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | grep 'certificate SHA-256 digest:' | tail -n 1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256="ad4aae0c14ee8a78617fed361baf6f4fb9236650f5cc6e724cfbe992ff5c394a"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Unexpected APK signing certificate. Expected $EXPECTED_SHA256 but got $ACTUAL_SHA256."
            exit 1
          fi

          echo "Stable OANIX debug signing certificate verified."

      - name: Publish stable signing verification status
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'oanix/stable-debug-signing',
              description: 'Stable OANIX debug signing certificate verified',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })

      - name: Remove stable signing material from workspace
        if: always() && github.event_name == 'push'
        run: rm -f "$GITHUB_WORKSPACE/android/app/oanix-stable-debug.keystore"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oanix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release AAB validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: oanix-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

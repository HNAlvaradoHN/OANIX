name: OANIX Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore stable debug signing key on main
        if: github.event_name == 'push'
        env:
          OANIX_DEBUG_KEYSTORE_BASE64: ${{ secrets.OANIX_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$OANIX_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Stable debug signing secret OANIX_DEBUG_KEYSTORE_BASE64 is required for main Android builds."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$OANIX_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Android web bundle
        run: npm run build:android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK and release AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

      - name: Report debug APK signing certificate
        if: github.event_name == 'push'
        working-directory: android
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found in ANDROID_HOME/build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oanix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release AAB validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: oanix-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

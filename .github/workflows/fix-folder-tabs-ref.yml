name: Fix folder tab type

on:
  push:
    branches:
      - agent/v1-access-folder-polish
    paths:
      - .github/fix_folder_tabs_ref.py
      - .github/workflows/fix-folder-tabs-ref.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-access-folder-polish
      - name: Apply fix
        run: python .github/fix_folder_tabs_ref.py
      - name: Remove temporary patch files
        run: rm .github/fix_folder_tabs_ref.py .github/workflows/fix-folder-tabs-ref.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize folder tab overflow observer"
          git push origin HEAD:agent/v1-access-folder-polish

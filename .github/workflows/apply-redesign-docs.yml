name: Apply redesign documentation update

on:
  push:
    branches: [design/post-v3-midnight-violet]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[redesign-docs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/post-v3-midnight-violet
          fetch-depth: 0

      - name: Update post-V3 project state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Remove the helper replaced by NoteAvatar.
          workspace_path = Path('src/features/notes/NotesWorkspace.tsx')
          workspace = workspace_path.read_text()
          workspace = workspace.replace("\nfunction noteInitial(title: string): string {\n  const first = title.trim().charAt(0)\n  return first ? first.toUpperCase() : 'N'\n}\n", "\n", 1)
          workspace_path.write_text(workspace)

          roadmap_path = Path('docs/ROADMAP.md')
          roadmap = roadmap_path.read_text()
          start = roadmap.index('### Deudas visibles / validación restante de V3')
          end = roadmap.index('\n---\n\n## V4 — Funciones avanzadas', start)
          replacement = '''### Cierre de V3 y fase visual post-V3\n\n- V3 Android con Capacitor quedó cerrada formalmente en issue #79 después de validar las funciones principales en teléfono real.\n- La firma debug interna estable se reconstruye solo desde GitHub Secret, Gradle la usa explícitamente y CI comprueba la huella SHA-256 exacta antes de publicar el APK.\n- La continuidad de actualización se validó físicamente instalando un APK `versionCode 1` y luego `versionCode 2` encima, sin desinstalar; Android aceptó la actualización.\n- La firma futura de Play Store permanece separada de la firma debug interna.\n- El problema conocido de huella en cold start permanece aislado en #105 y se retomará durante el pulido Android/RC, sin debilitar la seguridad biométrica.\n- `appId`, icono/splash finales e identidad de publicación permanecen como trabajo de la fase previa a publicación.\n\n### Rediseño visual activo\n\n- [x] Arquitectura de tema basada en variables semánticas, comenzando por `Midnight Violet`.\n- [x] Tema oscuro base negro/morado con cian como acento técnico y contraste alto.\n- [x] Corrección preventiva de tipografía/descendentes para evitar letras cortadas en títulos grandes y campos de nota.\n- [x] Identidad de la `O` refinada como núcleo tecnológico con aro/orbita sutil y respeto a `prefers-reduced-motion`.\n- [x] Bordes/paneles más definidos con glow suave dependiente de tokens de tema.\n- [x] Lista de notas separada en tarjetas tipo papel digital/tech premium.\n- [x] Miniatura circular automática desde la primera imagen ya cifrada de la nota, con inicial como fallback y URL temporal revocada en memoria.\n- [ ] Selector visible de temas y presets adicionales después de validar visualmente el sistema base.\n- [ ] Aplicar el diseño consolidado a Android y retomar #105 dentro del pulido final/RC.\n'''
          roadmap = roadmap[:start] + replacement + roadmap[end:]
          roadmap = roadmap.replace('- [ ] Temas y personalización avanzada', '- [ ] Temas y personalización avanzada *(la arquitectura de tema y Midnight Violet comienzan en la fase visual post-V3; V4 conserva personalización avanzada)*')
          roadmap = roadmap.replace('- [ ] Avatar o foto opcional por nota, almacenada de forma privada', '- [ ] Portada/avatar elegible explícitamente por nota *(el rediseño post-V3 ya usa de forma segura la primera imagen cifrada como miniatura automática)*')
          state_marker = '## Estado actual\n'
          state_start = roadmap.index(state_marker)
          roadmap = roadmap[:state_start] + '''## Estado actual\n\n**V1 — Núcleo local: CERRADA ✅**\n\n**V2 — Cuenta y sincronización: CERRADA FUNCIONALMENTE ✅; deudas de validación #69, #70 y #73 continúan visibles.**\n\n**V3 — Android con Capacitor: CERRADA ✅. Firma debug estable y actualización APK → APK validadas; #105 queda diferido al pulido Android/RC.**\n\n**Fase activa: rediseño/pulido visual post-V3, empezando por la PWA compartida con Android.**\n\nNo iniciar funciones funcionales de V4 por impulso; el trabajo actual es identidad visual, temas base y preparación de publicación.\n'''
          roadmap_path.write_text(roadmap)

          memory_path = Path('docs/PROJECT_MEMORY.md')
          memory = memory_path.read_text()
          state_start = memory.index('## 1. Estado actual')
          state_end = memory.index('\n---\n\n## 2. Forma de trabajo acordada', state_start)
          new_state = '''## 1. Estado actual\n\n**Última actualización:** 2026-08-18\n\n**Fase activa:** rediseño/pulido visual post-V3.\n\n**V1 — Núcleo local:** CERRADA.\n\n**V2 — Cuenta y sincronización:** CERRADA FUNCIONALMENTE. Mantener visibles las deudas de validación #69, #70 y #73.\n\n**V3 — Android con Capacitor:** CERRADA formalmente en issue #79. Las funciones principales se validaron en dispositivo real. La firma debug interna estable quedó configurada y verificada por CI con huella exacta; también se validó en teléfono una actualización APK `versionCode 1` → `versionCode 2` sin desinstalar. La clave definitiva de Play Store sigue siendo independiente.\n\n**Deuda Android diferida:** issue #105 — la huella puede tardar 2–3 cold starts. Se retoma durante el pulido Android/RC junto con pantalla de bloqueo, arranque y transiciones; no reducir requisitos de seguridad biométrica para ocultarlo.\n\n**Dirección visual aprobada:**\n- Base oscura premium; primer preset `Midnight Violet` (negro + morado, cian técnico secundario).\n- Tipografía con espacio suficiente para descendentes; no aceptar `g`, `p`, `q`, `y` o títulos recortados.\n- `O` de OANIX como núcleo tecnológico con anillos/orbita sutil, animación discreta y fallback de movimiento reducido.\n- Bordes definidos con glow suave controlado por variables de tema.\n- Notas visualmente separadas como tarjetas/papel digital tecnológico.\n- El círculo de nota puede mostrar automáticamente la primera imagen ya cifrada de esa nota; si no existe, conserva la inicial. No crear una copia plaintext ni persistencia paralela para la miniatura.\n- Construir el sistema de temas ahora; añadir presets/selector después de validar la base.\n\n**Regla actual:** no meter funciones de V4 para retrasar el rediseño. Primero consolidar PWA, luego Android + #105, luego identidad final/publicación.\n'''
          memory = memory[:state_start] + new_state + memory[state_end:]
          memory_path.write_text(memory)

          changelog_path = Path('docs/CHANGELOG.md')
          changelog = changelog_path.read_text()
          anchor = '## Unreleased\n'
          entries = '''## Unreleased\n- Post-V3 Rediseño visual — primer pase `Midnight Violet`: nueva capa de tema semántico negro/morado con cian técnico, bordes definidos y glow suave, tipografía reforzada contra recortes de descendentes, `O` tecnológica con núcleo/orbita sutil y movimiento reducido, workspace/editor convertidos a superficie oscura premium y notas separadas en tarjetas tipo papel digital.\n- Post-V3 Miniaturas de notas: el avatar de lista y de nota abierta reutiliza la primera imagen ya cifrada como miniatura mediante `loadEncryptedImagePreview`; si no existe mantiene la inicial. La imagen solo vive como Blob URL temporal en memoria y se revoca al desmontar/cambiar.\n- V3 cerrada: firma debug estable verificada con SHA-256 exacta, estado observable en CI y prueba física de continuidad APK `versionCode 1` → `versionCode 2` aceptada sin desinstalar. Issue #79 cerrado; #105 permanece diferido al pulido Android/RC.\n'''
          if entries not in changelog:
              changelog = changelog.replace(anchor, entries, 1)
          changelog_path.write_text(changelog)
          PY

      - name: Commit project-state update
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/notes/NotesWorkspace.tsx docs/ROADMAP.md docs/PROJECT_MEMORY.md docs/CHANGELOG.md
          git commit -m "Docs: record post-V3 visual phase [redesign-docs]"
          git push origin HEAD:design/post-v3-midnight-violet

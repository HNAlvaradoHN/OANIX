name: Fix mobile media code types

on:
  push:
    branches:
      - agent/v1-mobile-media-code-refine

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-mobile-media-code-refine

      - name: Apply TypeScript fix
        run: python .github/fix_mobile_media_code_types.py

      - name: Remove temporary patch files
        run: |
          rm .github/fix_mobile_media_code_types.py
          rm .github/workflows/fix-mobile-media-code-types.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: narrow full-screen code editor elements"
          git push origin agent/v1-mobile-media-code-refine

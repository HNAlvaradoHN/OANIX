name: Apply mobile editor polish

on:
  push:
    branches:
      - agent/v1-mobile-editor-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-mobile-editor-polish

      - name: Apply mobile editor polish
        run: python .github/apply-mobile-editor-polish.py

      - name: Remove temporary patch files
        run: |
          rm .github/apply-mobile-editor-polish.py
          rm .github/workflows/apply-mobile-editor-polish.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: polish mobile editor interactions"
          git push origin agent/v1-mobile-editor-polish

name: Fix search API

on:
  push:
    branches:
      - agent/v1-local-search
    paths:
      - '.github/workflows/fix-search-api.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-local-search
          fetch-depth: 0
      - name: Apply refactor
        run: python .github/fix_search_api.py
      - name: Remove temporary patch files
        run: rm -f .github/fix_search_api.py .github/workflows/fix-search-api.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: decouple local search from note model"
          git push origin HEAD:agent/v1-local-search

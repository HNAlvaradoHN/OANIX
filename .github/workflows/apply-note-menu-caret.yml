name: Apply note menu and trailing caret patch

on:
  push:
    branches:
      - agent/v1-note-menu-caret
    paths:
      - .github/apply_note_menu_caret.py
      - .github/workflows/apply-note-menu-caret.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v1-note-menu-caret

      - name: Apply patch
        run: python .github/apply_note_menu_caret.py

      - name: Remove temporary patch files
        run: rm .github/apply_note_menu_caret.py .github/workflows/apply-note-menu-caret.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: improve note actions and trailing image cursor"
          git push

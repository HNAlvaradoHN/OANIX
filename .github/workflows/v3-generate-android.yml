name: V3 Generate Android Shell

on:
  push:
    branches: ['feature/v3-capacitor-foundation']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-android:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v3-capacitor-foundation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Android web bundle
        run: npm run build:android

      - name: Generate and sync Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Commit generated Android shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android
          if git diff --cached --quiet; then
            echo "Android shell is already up to date."
            exit 0
          fi
          git commit -m "V3: generate Capacitor Android shell [skip ci]"
          git push origin HEAD:feature/v3-capacitor-foundation

name: Apply save navigation responsive repair

on:
  push:
    branches:
      - agent/v1-save-navigation-responsive

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-save-navigation-responsive

      - name: Apply implementation
        run: python .github/apply-save-navigation-responsive.py

      - name: Remove temporary patch files
        run: |
          rm .github/apply-save-navigation-responsive.py
          rm .github/workflows/apply-save-navigation-responsive.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: repair mobile saving navigation and responsive layout"
          git push origin agent/v1-save-navigation-responsive

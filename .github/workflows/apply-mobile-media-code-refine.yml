name: Apply mobile media and code refinement

on:
  push:
    branches:
      - agent/v1-mobile-media-code-refine

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-mobile-media-code-refine

      - name: Apply refinement
        run: python .github/apply_mobile_media_code_refine.py

      - name: Remove temporary patch files
        run: |
          rm .github/apply_mobile_media_code_refine.py
          rm .github/workflows/apply-mobile-media-code-refine.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: refine mobile image and code editing"
          git push origin agent/v1-mobile-media-code-refine

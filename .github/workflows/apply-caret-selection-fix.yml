name: Apply caret and selection repair

on:
  push:
    branches:
      - agent/v1-editor-caret-selection

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-editor-caret-selection

      - name: Apply implementation
        run: python .github/apply_caret_selection_fix.py

      - name: Remove temporary patch files
        run: |
          rm .github/apply_caret_selection_fix.py
          rm .github/workflows/apply-caret-selection-fix.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: repair protected selection visuals and editor caret placement"
          git push origin agent/v1-editor-caret-selection

name: Deploy OANIX to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build OANIX
        env:
          VITE_GOOGLE_DRIVE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_WEB_CLIENT_ID }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed shell assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://hnalvaradohn.github.io/OANIX/"
          ORIGIN="https://hnalvaradohn.github.io"

          html="$(curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors "${BASE_URL}?oanix_smoke=${GITHUB_SHA}")"
          css_path="$(printf '%s' "$html" | grep -oE 'href="/OANIX/assets/[^"]+\.css"' | head -n1 | cut -d'"' -f2)"
          js_path="$(printf '%s' "$html" | grep -oE 'src="/OANIX/assets/[^"]+\.js"' | head -n1 | cut -d'"' -f2)"

          test -n "$css_path"
          test -n "$js_path"

          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            --output /tmp/oanix.css "${ORIGIN}${css_path}?oanix_smoke=${GITHUB_SHA}"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --retry-all-errors \
            --output /tmp/oanix.js "${ORIGIN}${js_path}?oanix_smoke=${GITHUB_SHA}"

          test "$(wc -c < /tmp/oanix.css)" -gt 10000
          test "$(wc -c < /tmp/oanix.js)" -gt 10000
          grep -q '.vault-shell' /tmp/oanix.css
          grep -q 'data-oanix-workspace-v2' /tmp/oanix.js

name: Deploy OANIX to GitHub Pages

on:
  push:
    branches:
      - main
      - agent/oanix-notes-sheet-2026-09-02
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: preview-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: preview-source/.nvmrc

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install production dependencies
        working-directory: production
        run: npm ci --no-audit --no-fund

      - name: Build production from main
        working-directory: production
        env:
          VITE_GOOGLE_DRIVE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_WEB_CLIENT_ID }}
        run: npm run build

      - name: Install preview dependencies
        working-directory: preview-source
        run: npm ci --no-audit --no-fund

      - name: Build isolated preview PWA
        working-directory: preview-source
        env:
          VITE_GOOGLE_DRIVE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_WEB_CLIENT_ID }}
          OANIX_PUBLIC_BASE: /OANIX/preview/
        run: npm run build

      - name: Combine production and preview without replacing main shell
        run: |
          rm -rf production/dist/preview
          mkdir -p production/dist/preview
          cp -a preview-source/dist/. production/dist/preview/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./production/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout verifier source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production shell
        env:
          OANIX_PAGES_BASE_URL: https://hnalvaradohn.github.io/OANIX/
        run: npm run verify:pages

      - name: Verify isolated preview shell
        env:
          OANIX_PAGES_BASE_URL: https://hnalvaradohn.github.io/OANIX/preview/
        run: npm run verify:pages

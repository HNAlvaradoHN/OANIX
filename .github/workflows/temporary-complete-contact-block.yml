name: Temporary Complete Contact Block

on:
  push:
    branches: [feat/oanix-contact-block-2026-09-04]

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oanix-contact-block-2026-09-04
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply focused surface integration
        run: node scripts/complete-oanix-contact-block.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test OANIX
        run: npm test
      - name: Build OANIX
        run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/editor/implementations/OanixNotesSheetSurface.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire OANIX contact into notes surface"
          git push origin HEAD:feat/oanix-contact-block-2026-09-04

name: Apply responsive interaction polish

on:
  push:
    branches:
      - agent/v1-responsive-polish-keyboard-menus

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-responsive-polish-keyboard-menus

      - name: Apply implementation
        run: python .github/apply_responsive_polish.py

      - name: Remove temporary patch files
        run: |
          rm .github/apply_responsive_polish.py
          rm .github/workflows/apply-responsive-polish.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: polish responsive overlays and keyboard-safe controls"
          git push origin agent/v1-responsive-polish-keyboard-menus

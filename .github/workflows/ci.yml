name: OANIX CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture npm test failure
        run: npm test > /tmp/oanix-test.log 2>&1 || true

      - name: Publish temporary diagnostic statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          block="$(grep -A24 -m1 '^not ok ' /tmp/oanix-test.log || true)"
          title="$(printf '%s\n' "$block" | head -n 1)"
          location="$(printf '%s\n' "$block" | grep -m1 -E 'location:|file:///' || true)"
          error="$(printf '%s\n' "$block" | grep -A3 -m1 'error: |-' | tail -n +2 | head -n 1 || true)"
          publish() {
            context="$1"
            value="$2"
            if [ -z "$value" ]; then value='(not found)'; fi
            value="$(printf '%s' "$value" | tr '\n\r' '  ' | cut -c1-120)"
            gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
              -f state=success -f context="$context" -f description="$value"
          }
          publish 'diagnostic/npm-title' "$title"
          publish 'diagnostic/npm-location' "$location"
          publish 'diagnostic/npm-error' "$error"

      - name: Test OANIX
        run: npm test

      - name: Build OANIX
        run: npm run build

      - name: Audit offline production bundle
        run: npm run audit:offline-bundle

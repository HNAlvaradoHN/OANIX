name: OANIX CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test OANIX
        run: npm test

      - name: Build OANIX
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/oanix-build.log || {
            grep -E "error TS|error:" /tmp/oanix-build.log || true
            exit 1
          }

      - name: Audit offline production bundle
        run: npm run audit:offline-bundle

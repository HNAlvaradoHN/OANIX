name: OANIX CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture npm test failure
        run: npm test > /tmp/oanix-test.log 2>&1 || true

      - name: Failure path A-F
        continue-on-error: true
        run: |
          failed="$(grep -oE 'tests/[A-Za-z0-9._-]+\.test\.ts' /tmp/oanix-test.log | head -1 || true)"
          case "$failed" in tests/[a-fA-F]*) exit 1;; esac

      - name: Failure path G-L
        continue-on-error: true
        run: |
          failed="$(grep -oE 'tests/[A-Za-z0-9._-]+\.test\.ts' /tmp/oanix-test.log | head -1 || true)"
          case "$failed" in tests/[g-lG-L]*) exit 1;; esac

      - name: Failure path M-R
        continue-on-error: true
        run: |
          failed="$(grep -oE 'tests/[A-Za-z0-9._-]+\.test\.ts' /tmp/oanix-test.log | head -1 || true)"
          case "$failed" in tests/[m-rM-R]*) exit 1;; esac

      - name: Failure path S-Z
        continue-on-error: true
        run: |
          failed="$(grep -oE 'tests/[A-Za-z0-9._-]+\.test\.ts' /tmp/oanix-test.log | head -1 || true)"
          case "$failed" in tests/[s-zS-Z]*) exit 1;; esac

      - name: Test OANIX
        run: npm test

      - name: Build OANIX
        run: npm run build

      - name: Audit offline production bundle
        run: npm run audit:offline-bundle

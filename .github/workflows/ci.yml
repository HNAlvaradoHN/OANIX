name: OANIX CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # TEMP PR #629 diagnostics. The normal suite below remains authoritative.
      - name: Diagnose tests A-F
        continue-on-error: true
        run: node --experimental-strip-types --test tests/[a-f]*.test.ts

      - name: Diagnose tests G-L
        continue-on-error: true
        run: node --experimental-strip-types --test tests/[g-l]*.test.ts

      - name: Diagnose tests M-R
        continue-on-error: true
        run: node --experimental-strip-types --test tests/[m-r]*.test.ts

      - name: Diagnose tests S-Z
        continue-on-error: true
        run: node --experimental-strip-types --test tests/[s-z]*.test.ts

      - name: Test OANIX
        run: npm test

      - name: Build OANIX
        run: npm run build

      - name: Audit offline production bundle
        run: npm run audit:offline-bundle

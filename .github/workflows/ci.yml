name: OANIX CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture npm test failure
        run: npm test > /tmp/oanix-test.log 2>&1 || true

      - name: Publish temporary diagnostic status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(grep -m1 -E 'not ok|npm error|npm ERR!' /tmp/oanix-test.log || true)"
          if [ -z "$summary" ]; then summary="$(tail -n 1 /tmp/oanix-test.log)"; fi
          summary="$(printf '%s' "$summary" | tr '\n\r' '  ' | cut -c1-120)"
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success \
            -f context='diagnostic/npm-test' \
            -f description="$summary"

      - name: Test OANIX
        run: npm test

      - name: Build OANIX
        run: npm run build

      - name: Audit offline production bundle
        run: npm run audit:offline-bundle

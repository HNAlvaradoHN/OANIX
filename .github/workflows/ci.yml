name: OANIX CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test OANIX
        run: npm test

      - name: Build OANIX
        run: |
          if npm run build > /tmp/oanix-build.log 2>&1; then
            tail -20 /tmp/oanix-build.log
          else
            echo 'OANIX_BUILD_ERROR_BEGIN'
            tail -40 /tmp/oanix-build.log
            echo 'OANIX_BUILD_ERROR_END'
            exit 1
          fi

      - name: Audit offline production bundle
        run: npm run audit:offline-bundle

name: Apply trailing caret CSS fix

on:
  push:
    branches:
      - agent/v1-menu-caret-followup
    paths:
      - .github/workflows/apply-trailing-caret-css.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v1-menu-caret-followup
          fetch-depth: 0

      - name: Add final writing zone CSS
        run: |
          cat >> src/features/images/images.css <<'EOF'

          /* Dedicated final writing zone below floated media. */
          .image-note-editor-root .editor-surface > p[data-oanix-trailing-caret='true'] {
            display: block;
            clear: both;
            min-height: 2.75rem;
            margin: 0.4rem 0 0;
            padding: 0.35rem 0 0.15rem;
            cursor: text;
          }
          EOF

      - name: Remove temporary workflow
        run: git rm .github/workflows/apply-trailing-caret-css.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: add final image writing zone styling"
          git push origin HEAD:agent/v1-menu-caret-followup

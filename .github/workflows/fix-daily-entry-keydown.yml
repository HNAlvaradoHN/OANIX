name: Fix daily entry keydown

on:
  push:
    branches:
      - agent/v1-daily-entries
    paths:
      - .github/fix_daily_entry_keydown.py
      - .github/workflows/fix-daily-entry-keydown.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-daily-entries
      - name: Apply fix
        run: python .github/fix_daily_entry_keydown.py
      - name: Remove temporary patch files
        run: rm .github/fix_daily_entry_keydown.py .github/workflows/fix-daily-entry-keydown.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete daily entry keyboard flow"
          git push origin HEAD:agent/v1-daily-entries

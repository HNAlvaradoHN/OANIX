name: Apply access and folder polish

on:
  push:
    branches:
      - agent/v1-access-folder-polish
    paths:
      - .github/apply_access_folder_polish.py
      - .github/workflows/apply-access-folder-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-access-folder-polish
      - name: Apply implementation
        run: python .github/apply_access_folder_polish.py
      - name: Remove temporary patch files
        run: rm .github/apply_access_folder_polish.py .github/workflows/apply-access-folder-polish.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: polish access and folder navigation"
          git push origin HEAD:agent/v1-access-folder-polish

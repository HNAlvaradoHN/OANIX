name: Apply personalization slot

on:
  push:
    branches: [design/personalization-top-strip]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[personalization-slot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/personalization-top-strip
          fetch-depth: 0

      - name: Insert dedicated personalization host
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/features/notes/NotesWorkspace.tsx')
          text = path.read_text()
          anchor = "        </header>\n\n        {searchOpen && ("
          replacement = "        </header>\n\n        <div className=\"oanix-personalization-slot\" aria-label=\"Acceso a personalización\" />\n\n        {searchOpen && ("
          if replacement in text:
              raise SystemExit(0)
          if anchor not in text:
              raise SystemExit('Notes header anchor not found')
          path.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Commit slot
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/notes/NotesWorkspace.tsx
          git commit -m "Design: add personalization top slot [personalization-slot]"
          git push origin HEAD:design/personalization-top-strip

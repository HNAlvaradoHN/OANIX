name: Apply caret drag guard

on:
  push:
    branches:
      - agent/v1-caret-drag-guard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-caret-drag-guard
      - run: python .github/apply_caret_drag_guard.py
      - run: |
          rm .github/apply_caret_drag_guard.py
          rm .github/workflows/apply-caret-drag-guard.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: guard caret placement after selection drags"
          git push origin agent/v1-caret-drag-guard

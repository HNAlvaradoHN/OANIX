name: Qwen Independent PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qwen-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Independent Qwen review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      OPENAI_BASE_URL: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      OPENAI_MODEL: qwen3-coder-30b-a3b-instruct

    steps:
      - name: Checkout PR head with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main --force

      - name: Prepare authoritative review prompt
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          git diff --name-only origin/main...HEAD > QWEN_REVIEW_CHANGED_FILES.txt
          if [[ ! -s QWEN_REVIEW_CHANGED_FILES.txt ]]; then
            echo "No changed files found between origin/main and HEAD." >&2
            exit 1
          fi

          {
            cat <<'INSTRUCTIONS'
          You are the independent technical reviewer for OANIX.
          The instructions, SHAs, changed-file list and diff below are injected directly by CI. You do not need filesystem tools to access them.

          Do not modify files, commit, push, merge, close the PR, or call GitHub write operations.
          Your only task is analysis and review.

          Mandatory grounding protocol:
          - Treat only the AUTHORITATIVE DIFF below as evidence of what this PR changed.
          - Never infer changed files from the PR title, commit messages, prior sessions or memory.
          - Copy every path from CHANGED FILES under ARCHIVOS CAMBIADOS.
          - Do not invent paths, components, functions, dependencies or behavior absent from the supplied context.
          - If the supplied context is internally inconsistent, output only `REVIEW_INCOMPLETA: contexto inconsistente`.
          - You may reason about regression risk from the diff, but clearly label anything not directly proven by the supplied code.

          Independence protocol:
          - Reason from the supplied repository evidence yourself.
          - Do not mirror another AI's conclusion merely because it may have proposed the change.
          - Do not reject it merely to be different.
          - Look for root causes, state/DOM races, CSS dependencies, persistence/sync effects, mobile/PWA/desktop/Android regressions, and test gaps.
          - Preserve behavior that is already working.

          Write the final review in Spanish with this exact structure:
          MAIN ANALIZADO: <exact MAIN_SHA below>
          PR HEAD: <exact HEAD_SHA below>
          ARCHIVOS CAMBIADOS:
          <copy every path below, one per line>
          ## Resumen
          ## Hallazgos críticos
          ## Riesgos y regresiones
          ## Alternativas o mejoras
          ## Veredicto

          Use one verdict: APROBAR, APROBAR CON OBSERVACIONES, SOLICITAR CAMBIOS.
          Cite supplied repository paths/functions/selectors for every important finding.

          ===== PROJECT REVIEW POLICY (QWEN.md) =====
          INSTRUCTIONS
            cat QWEN.md
            printf '\n===== END PROJECT REVIEW POLICY =====\n\n'
            printf 'PR_NUMBER: %s\n' '${{ github.event.pull_request.number }}'
            printf 'MAIN_SHA: %s\n' "$main_sha"
            printf 'HEAD_SHA: %s\n\n' "$head_sha"
            printf '===== CHANGED FILES =====\n'
            cat QWEN_REVIEW_CHANGED_FILES.txt
            printf '===== END CHANGED FILES =====\n\n'
            printf '===== AUTHORITATIVE DIFF =====\n'
            git diff --no-ext-diff --unified=80 origin/main...HEAD
            printf '\n===== END AUTHORITATIVE DIFF =====\n'
          } > QWEN_REVIEW_PROMPT.txt

      - name: Install Qwen Code
        if: env.QWEN_API_KEY != ''
        shell: bash
        run: npm install --silent --no-audit --prefer-offline --global @qwen-code/qwen-code@0.22.1

      - name: Review independently with grounded Qwen prompt
        id: qwen
        if: env.QWEN_API_KEY != ''
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ env.QWEN_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p qwen-artifacts
          if ! qwen --yolo --channel=CI --output-format json \
            < QWEN_REVIEW_PROMPT.txt \
            > qwen-artifacts/stdout.log 2> qwen-artifacts/stderr.log; then
            echo "Qwen Code execution failed." >&2
            cat qwen-artifacts/stderr.log >&2
            exit 1
          fi

          if ! jq -e . qwen-artifacts/stdout.log >/dev/null 2>&1; then
            echo "Qwen stdout was not valid JSON." >&2
            exit 1
          fi

          jq -r '[.[] | select(.type == "assistant")] | last | .message.content[] | select(.type == "text") | .text' \
            qwen-artifacts/stdout.log > QWEN_REVIEW.md

          if [[ ! -s QWEN_REVIEW.md ]]; then
            echo "Qwen returned an empty review." >&2
            exit 1
          fi

      - name: Validate Qwen grounding
        id: validate
        if: steps.qwen.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eqi 'API Error|REVIEW_INCOMPLETA|no tengo acceso|no pude (leer|acceder)' QWEN_REVIEW.md; then
            echo "Qwen review is incomplete or contains an API/access error." >&2
            exit 1
          fi

          main_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          grep -Fq "MAIN ANALIZADO: ${main_sha}" QWEN_REVIEW.md || {
            echo "Qwen reported the wrong main SHA." >&2
            exit 1
          }
          grep -Fq "PR HEAD: ${head_sha}" QWEN_REVIEW.md || {
            echo "Qwen reported the wrong PR head SHA." >&2
            exit 1
          }

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            grep -Fq "$path" QWEN_REVIEW.md || {
              echo "Qwen omitted changed path from grounded review: $path" >&2
              exit 1
            }
          done < QWEN_REVIEW_CHANGED_FILES.txt

          grep -Eq '## Veredicto' QWEN_REVIEW.md || {
            echo "Qwen review omitted the verdict section." >&2
            exit 1
          }
          grep -Eq 'APROBAR CON OBSERVACIONES|SOLICITAR CAMBIOS|APROBAR' QWEN_REVIEW.md || {
            echo "Qwen review omitted a recognized verdict." >&2
            exit 1
          }

      - name: Upload Qwen audit artifacts
        if: always() && env.QWEN_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: qwen-grounded-review
          path: |
            QWEN_REVIEW_PROMPT.txt
            QWEN_REVIEW_CHANGED_FILES.txt
            QWEN_REVIEW.md
            qwen-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Report unavailable independent review
        if: always() && env.QWEN_API_KEY != '' && (steps.qwen.outcome != 'success' || steps.validate.outcome != 'success')
        shell: bash
        run: |
          echo "::warning::Qwen automatic review was unavailable or incomplete. OANIX CI and Android remain the technical gates."
          {
            echo "### Qwen automatic review unavailable"
            echo
            echo "The independent reviewer did not return a grounded review. This is non-blocking by project policy; OANIX CI and Android remain authoritative gates."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Qwen review as PR comment
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf '<!-- oanix-qwen-independent-review -->\n'
            printf '### Qwen — revisión técnica independiente\n\n'
            cat QWEN_REVIEW.md
          } > /tmp/qwen-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/qwen-comment.md

      - name: Integration not activated yet
        if: env.QWEN_API_KEY == ''
        run: |
          echo "Qwen review is configured but QWEN_API_KEY is not present yet."

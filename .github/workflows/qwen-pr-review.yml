name: Qwen Independent PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qwen-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Independent Qwen review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}

    steps:
      - name: Checkout PR head with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main --force

      - name: Prepare visible review context
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          git diff --name-only origin/main...HEAD > QWEN_REVIEW_CHANGED_FILES.txt
          if [[ ! -s QWEN_REVIEW_CHANGED_FILES.txt ]]; then
            echo "No changed files found between origin/main and HEAD." >&2
            exit 1
          fi
          {
            printf '# OANIX authoritative PR review context\n\n'
            printf 'MAIN_SHA: %s\n' "$main_sha"
            printf 'HEAD_SHA: %s\n\n' "$head_sha"
            printf '## Changed files\n'
            cat QWEN_REVIEW_CHANGED_FILES.txt
            printf '\n## Authoritative diff\n```diff\n'
            git diff --no-ext-diff --unified=80 origin/main...HEAD
            printf '\n```\n'
          } > QWEN_REVIEW_CONTEXT.md

      - name: Review independently with Qwen Code
        id: qwen
        if: env.QWEN_API_KEY != ''
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ env.QWEN_API_KEY }}
          openai_base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
          openai_model: qwen3-coder-30b-a3b-instruct
          upload_artifacts: true
          prompt: |-
            You are the independent technical reviewer for OANIX.

            Read QWEN.md completely before doing anything else.
            Then read `QWEN_REVIEW_CONTEXT.md` completely. It is generated by CI immediately before your run and is the authoritative source for the current PR SHA, current origin/main SHA, changed-file list and complete diff.

            This is PR #${{ github.event.pull_request.number }}.
            PR head SHA reported by GitHub: ${{ github.event.pull_request.head.sha }}
            GitHub reported base SHA: ${{ github.event.pull_request.base.sha }}

            Do not modify files, commit, push, merge, close the PR, or call GitHub write operations.
            Your only task is analysis and review.

            Mandatory grounding protocol — do not skip any step:
            1. Read `QWEN_REVIEW_CONTEXT.md` fully before making any claim.
            2. Use its MAIN_SHA exact value as MAIN ANALIZADO and HEAD_SHA exact value as PR HEAD.
            3. Copy every path from its `Changed files` section under ARCHIVOS CAMBIADOS.
            4. Treat only its `Authoritative diff` section as evidence of what this PR changed.
            5. Read the full repository contents of every changed source/test file and directly related files needed to assess behavior.
            6. Never infer changed files from the PR title, commit messages, prior sessions or memory.
            7. If you cannot read `QWEN_REVIEW_CONTEXT.md`, output only `REVIEW_INCOMPLETA: no pude leer el contexto autoritativo` and stop.
            8. Do not invent paths, components, functions, dependencies or behavior that are absent from the repository. If uncertain, say so.

            Independence protocol:
            - Reason from the repository yourself.
            - Do not mirror ChatGPT's proposed solution merely because it exists.
            - Do not reject it merely to be different.
            - Find root causes, competing runtimes, state/DOM races, hidden CSS dependencies, regressions and simpler alternatives.
            - Preserve behavior that is already working.
            - Call out stale assumptions in QWEN.md if current code disproves them.

            Review the PR for correctness, architecture, regression risk, mobile/PWA/desktop/Android effects, persistence/sync implications, and test quality.

            Write the final review in Spanish with this exact structure:
            MAIN ANALIZADO: <exact MAIN_SHA from QWEN_REVIEW_CONTEXT.md>
            PR HEAD: <exact HEAD_SHA from QWEN_REVIEW_CONTEXT.md>
            ARCHIVOS CAMBIADOS:
            <copy every changed path, one per line>
            ## Resumen
            ## Hallazgos críticos
            ## Riesgos y regresiones
            ## Alternativas o mejoras
            ## Veredicto

            Use one of these verdicts: APROBAR, APROBAR CON OBSERVACIONES, SOLICITAR CAMBIOS.
            Cite repository paths/functions/selectors for every important finding.

      - name: Validate Qwen grounding
        id: validate
        if: steps.qwen.outcome == 'success'
        shell: bash
        env:
          QWEN_REVIEW: ${{ steps.qwen.outputs.summary }}
        run: |
          set -euo pipefail
          printf '%s\n' "$QWEN_REVIEW" > /tmp/qwen-review.md

          if [[ ! -s /tmp/qwen-review.md ]]; then
            echo "Qwen returned an empty review." >&2
            exit 1
          fi

          if grep -Eqi 'API Error|REVIEW_INCOMPLETA|no tengo acceso|no pude (leer|acceder)' /tmp/qwen-review.md; then
            echo "Qwen review is not grounded or contains an API/access error." >&2
            exit 1
          fi

          main_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          grep -Fq "MAIN ANALIZADO: ${main_sha}" /tmp/qwen-review.md || {
            echo "Qwen reported the wrong main SHA." >&2
            exit 1
          }
          grep -Fq "PR HEAD: ${head_sha}" /tmp/qwen-review.md || {
            echo "Qwen reported the wrong PR head SHA." >&2
            exit 1
          }

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            grep -Fq "$path" /tmp/qwen-review.md || {
              echo "Qwen omitted changed path from grounded review: $path" >&2
              exit 1
            }
          done < QWEN_REVIEW_CHANGED_FILES.txt

      - name: Publish Qwen review as PR comment
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          QWEN_REVIEW: ${{ steps.qwen.outputs.summary }}
        run: |
          printf '%s\n' "$QWEN_REVIEW" > /tmp/qwen-review.md
          {
            printf '<!-- oanix-qwen-independent-review -->\n'
            printf '### Qwen — revisión técnica independiente\n\n'
            cat /tmp/qwen-review.md
          } > /tmp/qwen-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/qwen-comment.md

      - name: Integration not activated yet
        if: env.QWEN_API_KEY == ''
        run: |
          echo "Qwen review is configured but QWEN_API_KEY is not present yet."

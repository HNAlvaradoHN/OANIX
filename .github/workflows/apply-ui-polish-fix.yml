name: Apply visual polish fix

on:
  push:
    branches: [fix/notes-menu-ellipsis-theme-balance]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ui-polish-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notes-menu-ellipsis-theme-balance
          fetch-depth: 0

      - name: Apply narrow visual fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('src/styles/redesign.css')
          css = css_path.read_text()

          replacements = {
            "  --oanix-bg: #05060c;\n  --oanix-bg-deep: #020309;\n  --oanix-panel: #0c1020;\n  --oanix-panel-2: #10162a;\n  --oanix-panel-3: #151c32;\n  --oanix-paper: #0f1425;\n  --oanix-paper-hover: #151b31;":
            "  --oanix-bg: #0a0f18;\n  --oanix-bg-deep: #070a10;\n  --oanix-panel: #111827;\n  --oanix-panel-2: #172033;\n  --oanix-panel-3: #1d293c;\n  --oanix-paper: #141c2a;\n  --oanix-paper-hover: #1a2537;",
            "  --oanix-accent: #9b6cff;\n  --oanix-accent-strong: #7c4dff;\n  --oanix-accent-soft: #b99aff;":
            "  --oanix-accent: #8d7aff;\n  --oanix-accent-strong: #6f61ee;\n  --oanix-accent-soft: #b9afff;",
            "  --oanix-border: rgba(174, 157, 255, .25);\n  --oanix-border-strong: rgba(174, 157, 255, .52);\n  --oanix-border-muted: rgba(157, 169, 199, .16);\n  --oanix-glow: rgba(133, 85, 255, .24);\n  --oanix-glow-cyan: rgba(74, 222, 255, .13);\n  --oanix-shadow: rgba(0, 0, 0, .58);\n  --oanix-grid: rgba(154, 164, 194, .025);":
            "  --oanix-border: rgba(128, 148, 190, .28);\n  --oanix-border-strong: rgba(143, 159, 205, .5);\n  --oanix-border-muted: rgba(143, 159, 190, .18);\n  --oanix-glow: rgba(111, 97, 238, .18);\n  --oanix-glow-cyan: rgba(74, 222, 255, .12);\n  --oanix-shadow: rgba(0, 0, 0, .48);\n  --oanix-grid: rgba(154, 174, 205, .035);",
            ".notes-brand strong,\n.note-view__identity strong,\n.note-row__topline strong,\n.editor-surface h1,":
            ".notes-brand strong,\n.editor-surface h1,",
            "    radial-gradient(circle at 10% 8%, rgba(91, 70, 255, .2), transparent 32rem),\n    radial-gradient(circle at 86% 72%, rgba(126, 64, 255, .12), transparent 34rem),\n    radial-gradient(circle at 64% 40%, rgba(34, 211, 238, .06), transparent 22rem),":
            "    radial-gradient(circle at 10% 8%, rgba(79, 103, 255, .16), transparent 32rem),\n    radial-gradient(circle at 86% 72%, rgba(111, 97, 238, .08), transparent 34rem),\n    radial-gradient(circle at 64% 40%, rgba(34, 211, 238, .08), transparent 22rem),",
            ".vault-glow--one { background: #5b46ff !important; opacity: .18 !important; }\n.vault-glow--two { background: #6d28d9 !important; opacity: .15 !important; }\n.vault-glow--three { background: #22d3ee !important; opacity: .09 !important; }":
            ".vault-glow--one { background: #4f67ff !important; opacity: .14 !important; }\n.vault-glow--two { background: #6f61ee !important; opacity: .09 !important; }\n.vault-glow--three { background: #22d3ee !important; opacity: .11 !important; }",
            "  border-right: 1px solid rgba(155,108,255,.25) !important;\n  background:\n    linear-gradient(var(--oanix-grid) 1px, transparent 1px),\n    linear-gradient(90deg, var(--oanix-grid) 1px, transparent 1px),\n    linear-gradient(170deg, #0b0d18, #070910) !important;":
            "  border-right: 1px solid rgba(128,148,190,.28) !important;\n  background:\n    linear-gradient(var(--oanix-grid) 1px, transparent 1px),\n    linear-gradient(90deg, var(--oanix-grid) 1px, transparent 1px),\n    linear-gradient(170deg, #121927, #0b111b) !important;",
            "  border-bottom-color: rgba(155,108,255,.18) !important;\n  background: rgba(7,9,18,.88) !important;":
            "  border-bottom-color: rgba(128,148,190,.2) !important;\n  background: rgba(11,16,26,.92) !important;",
            "  border-color: rgba(155,108,255,.25) !important;\n  background: rgba(13,16,30,.985) !important;":
            "  border-color: rgba(137,151,193,.3) !important;\n  background: rgba(18,24,36,.99) !important;",
            "  background: rgba(8,10,19,.93) !important;\n  border-color: rgba(155,108,255,.12) !important;":
            "  background: rgba(12,17,27,.95) !important;\n  border-color: rgba(128,148,190,.16) !important;",
            "  scrollbar-color: rgba(155,108,255,.4) transparent;":
            "  scrollbar-color: rgba(112,132,190,.5) transparent;",
            "  border: 1px solid rgba(155,108,255,.17) !important;":
            "  border: 1px solid rgba(128,148,190,.24) !important;",
            "    linear-gradient(135deg, rgba(255,255,255,.025), transparent 38%),\n    linear-gradient(150deg, rgba(18,22,41,.94), rgba(8,10,19,.96)) !important;":
            "    linear-gradient(135deg, rgba(255,255,255,.035), transparent 38%),\n    linear-gradient(150deg, rgba(24,32,47,.96), rgba(13,18,29,.98)) !important;",
            "  background: linear-gradient(150deg, rgba(24,29,53,.97), rgba(10,12,23,.98)) !important;":
            "  background: linear-gradient(150deg, rgba(31,41,59,.98), rgba(16,22,34,.99)) !important;",
            "  background: linear-gradient(145deg, rgba(88,49,173,.2), rgba(11,14,27,.98)) !important;":
            "  background: linear-gradient(145deg, rgba(83,79,177,.16), rgba(15,22,35,.99)) !important;",
            "  border: 1px solid rgba(166,135,255,.52) !important;\n  background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.12), transparent 20%), linear-gradient(145deg,#5531aa,#24377d) !important;":
            "  border: 1px solid rgba(137,153,218,.58) !important;\n  background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.14), transparent 20%), linear-gradient(145deg,#6257c7,#2f579a) !important;",
            "  border-color: rgba(155,108,255,.25) !important;\n  background:\n    linear-gradient(180deg, rgba(20,24,44,.96), rgba(10,12,22,.98)) !important;":
            "  border-color: rgba(128,148,190,.28) !important;\n  background:\n    linear-gradient(180deg, rgba(24,33,48,.97), rgba(13,18,29,.99)) !important;"
          }

          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'Expected CSS anchor not found:\n{old[:100]}')
              css = css.replace(old, new, 1)

          hover_anchor = ".note-row:hover {\n  transform: translateY(-1px);"
          if hover_anchor not in css:
              raise SystemExit('note-row hover anchor not found')
          css = css.replace(hover_anchor, ".note-row:hover {\n  z-index: 2;\n  transform: translateY(-1px);", 1)

          selected_anchor = ".note-row--selected,\n.note-row--menu-open {\n"
          if selected_anchor not in css:
              raise SystemExit('menu-open anchor not found')
          css = css.replace(selected_anchor, ".note-row--selected,\n.note-row--menu-open {\n", 1)

          menu_fix = """
/* Keep an open contextual menu above neighboring transformed note cards. */
.note-row--menu-open { z-index: 120 !important; }
.note-row__menu-wrap { z-index: 4; }
.note-row__menu { z-index: 130 !important; }

/* Long note names must stay inside their card/header and end in an ellipsis. */
.note-row__topline,
.note-view__identity > div { min-width: 0; overflow: hidden; }
.note-row__topline strong,
.note-view__identity strong {
  min-width: 0;
  overflow: hidden !important;
  text-overflow: ellipsis;
  white-space: nowrap;
}
"""
          card_anchor = ".note-row__preview { color: var(--oanix-muted) !important; }\n"
          if card_anchor not in css:
              raise SystemExit('card text anchor not found')
          css = css.replace(card_anchor, card_anchor + menu_fix, 1)
          css_path.write_text(css)

          test_path = Path('tests/postV3VisualRedesign.test.ts')
          tests = test_path.read_text()
          addition = """

test('note menus stay above hovered siblings and long titles ellipsize', () => {
  assert.match(redesign, /\\.note-row:hover\\s*\\{[\\s\\S]*z-index:\\s*2/)
  assert.match(redesign, /\\.note-row--menu-open\\s*\\{\\s*z-index:\\s*120/)
  assert.match(redesign, /\\.note-row__menu\\s*\\{\\s*z-index:\\s*130/)
  assert.match(redesign, /\\.note-row__topline strong,[\\s\\S]*text-overflow:\\s*ellipsis/)
  assert.match(redesign, /\\.note-view__identity strong[\\s\\S]*white-space:\\s*nowrap/)
})
"""
          if "note menus stay above hovered siblings" not in tests:
              tests += addition
          test_path.write_text(tests)

          changelog_path = Path('docs/CHANGELOG.md')
          changelog = changelog_path.read_text()
          anchor = '## Unreleased\n'
          entry = "- Post-V3 UI polish: corrige la capa del menú `⋮` para que ninguna tarjeta en hover lo tape, fuerza elipsis en títulos largos y rebalancea `Midnight Violet` hacia grafito/azul noche más luminoso, dejando el morado como acento en vez de teñir toda la interfaz.\n"
          if entry not in changelog:
              changelog = changelog.replace(anchor, anchor + entry, 1)
          changelog_path.write_text(changelog)
          PY

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/redesign.css tests/postV3VisualRedesign.test.ts docs/CHANGELOG.md
          git commit -m "Fix: note menu layering and dark theme balance [ui-polish-applied]"
          git push origin HEAD:fix/notes-menu-ellipsis-theme-balance

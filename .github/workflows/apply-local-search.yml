name: Apply local search

on:
  push:
    branches:
      - agent/v1-local-search
    paths:
      - '.github/workflows/apply-local-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-local-search
          fetch-depth: 0
      - name: Apply implementation
        run: python .github/apply_local_search.py
      - name: Remove temporary patch files
        run: rm -f .github/apply_local_search.py .github/workflows/apply-local-search.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "V1: implement local encrypted-vault search"
          git push origin HEAD:agent/v1-local-search

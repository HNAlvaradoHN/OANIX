name: Apply editor protection and redo

on:
  push:
    branches:
      - agent/v1-editor-protection-redo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-editor-protection-redo

      - name: Apply implementation
        run: python .github/apply_editor_protection_redo.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: protect atomic editor blocks and add redo"
          git push origin HEAD:agent/v1-editor-protection-redo

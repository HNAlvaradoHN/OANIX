name: Apply V1 daily entries

on:
  push:
    branches:
      - agent/v1-daily-entries
    paths:
      - .github/apply_daily_entries.py
      - .github/workflows/apply-daily-entries.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-daily-entries
      - name: Normalize patch markers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/apply_daily_entries.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('\\\\\\"', '"').replace('\\\\"', '"').replace('\\"', '"')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply implementation
        run: python .github/apply_daily_entries.py
      - name: Remove temporary patch files
        run: rm .github/apply_daily_entries.py .github/workflows/apply-daily-entries.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: add daily entries inside notes"
          git push origin HEAD:agent/v1-daily-entries

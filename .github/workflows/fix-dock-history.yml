name: Apply dock history fix

on:
  push:
    branches:
      - agent/v1-responsive-shell-save-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-responsive-shell-save-fix
      - run: python .github/fix_dock_history.py
      - run: |
          rm .github/fix_dock_history.py
          rm .github/workflows/fix-dock-history.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: avoid double editor history actions"
          git push origin agent/v1-responsive-shell-save-fix

name: Apply tablet image alignment fix

on:
  push:
    branches:
      - agent/v1-tablet-image-align-fix
    paths:
      - .github/apply_tablet_alignment_fix.py
      - .github/workflows/apply-tablet-image-align-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-tablet-image-align-fix
      - name: Apply implementation
        run: python .github/apply_tablet_alignment_fix.py
      - name: Remove temporary patch files
        run: rm .github/apply_tablet_alignment_fix.py .github/workflows/apply-tablet-image-align-fix.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V1: fix tablet portrait image alignment"
          git push origin HEAD:agent/v1-tablet-image-align-fix

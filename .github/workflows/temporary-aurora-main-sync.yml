name: Temporary Aurora main sync

on:
  push:
    branches:
      - feat/aurora-native-note-sheet

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[aurora-sync-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main and preserve Aurora semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Current main is already integrated."
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^src/features/notes/NotesWorkspace.tsx$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            if printf '%s\n' "$conflicts" | grep -q '^src/features/notes/NotesWorkspace.tsx$'; then
              git checkout --ours src/features/notes/NotesWorkspace.tsx
              git add src/features/notes/NotesWorkspace.tsx
            fi
          fi

          python <<'PY'
          from pathlib import Path

          workspace_path = Path('src/features/notes/NotesWorkspace.tsx')
          workspace = workspace_path.read_text()
          workspace = workspace.replace(
              "if (saveState === 'dirty') return 'Cambios pendientes…'",
              "if (saveState === 'dirty') return 'Cambios pendientes · toca sincronizar'",
          )
          workspace = workspace.replace(
              "if (saveState === 'saving') return 'Guardando cifrado…'",
              "if (saveState === 'saving') return 'Guardando nota…'",
          )
          autosave = """    clearSaveTimer()\n    saveTimerRef.current = window.setTimeout(() => {\n      void flushPendingContent()\n    }, 550)\n"""
          workspace = workspace.replace(autosave, '', 1)
          if 'window.setTimeout(() => {\n      void flushPendingContent()\n    }, 550)' in workspace:
              raise SystemExit('The legacy 550ms content autosave is still present.')
          if "pendingContentRef.current = { noteId: selectedNote.id, blocks }" not in workspace:
              raise SystemExit('Aurora pending-content path changed unexpectedly.')
          workspace_path.write_text(workspace)

          sheet_path = Path('src/features/notes/themes/aurora-native/AuroraNativeNoteSheet.tsx')
          sheet = sheet_path.read_text()
          old_status = """            <span className={`save${props.error ? ' error' : ''}`} style={{ marginLeft: 'auto' }}>\n              <i />{props.deleting ? 'Eliminando…' : props.saveLabel}\n            </span>"""
          new_status = """            <button\n              type=\"button\"\n              className={`save native-manual-sync${props.error ? ' error' : ''}`}\n              style={{ marginLeft: 'auto' }}\n              onClick={() => void props.onFlush()}\n              disabled={props.deleting}\n              aria-label=\"Sincronizar y guardar nota ahora\"\n              title=\"Guardar nota ahora\"\n            >\n              <span className=\"native-manual-sync__icon\" aria-hidden=\"true\">↻</span>\n              <i />{props.deleting ? 'Eliminando…' : props.saveLabel}\n            </button>"""
          if 'native-manual-sync' not in sheet:
              if old_status not in sheet:
                  raise SystemExit('Aurora save-status markup changed unexpectedly.')
              sheet = sheet.replace(old_status, new_status, 1)
          sheet_path.write_text(sheet)

          css_path = Path('src/features/notes/themes/aurora-native/auroraNativeNoteSheet.css')
          css = css_path.read_text()
          if '.native-manual-sync{' not in css:
              css += """\n.native-manual-sync{padding:4px 8px;border-radius:999px;transition:background .15s,color .15s,transform .1s}\n.native-manual-sync:hover{background:var(--paper2);color:var(--acc-deep)}\n.native-manual-sync:active{transform:scale(.97)}\n.native-manual-sync:disabled{opacity:.6;cursor:default;transform:none}\n.native-manual-sync__icon{font-size:13px;line-height:1;color:var(--acc)}\n"""
          css_path.write_text(css)

          guard_path = Path('src/features/notes/mobileBackKeyboardGuard.ts')
          guard = guard_path.read_text()
          old_editable = """function editableElement(): HTMLElement | null {\n  const active = document.activeElement\n  if (!(active instanceof HTMLElement)) return null\n  if (active instanceof HTMLInputElement || active instanceof HTMLTextAreaElement || active instanceof HTMLSelectElement) {\n    return active\n  }\n  return active.isContentEditable ? active : null\n}"""
          new_editable = """function deepestActiveElement(): Element | null {\n  let active: Element | null = document.activeElement\n  while (active instanceof HTMLElement && active.shadowRoot?.activeElement) {\n    active = active.shadowRoot.activeElement\n  }\n  return active\n}\n\nfunction editableElement(): HTMLElement | null {\n  const active = deepestActiveElement()\n  if (!(active instanceof HTMLElement)) return null\n  if (active instanceof HTMLInputElement || active instanceof HTMLTextAreaElement || active instanceof HTMLSelectElement) {\n    return active\n  }\n  return active.isContentEditable ? active : null\n}"""
          if 'function deepestActiveElement()' not in guard:
              if old_editable not in guard:
                  raise SystemExit('Mobile back editable detection changed unexpectedly.')
              guard = guard.replace(old_editable, new_editable, 1)
          guard_path.write_text(guard)

          manual_test_path = Path('tests/manualNoteSaveAndMobileBlocks.test.ts')
          manual = manual_test_path.read_text()
          anchor = "const mainPath = new URL('../src/main.tsx', import.meta.url)"
          aurora_const = "const auroraSheetPath = new URL('../src/features/notes/themes/aurora-native/AuroraNativeNoteSheet.tsx', import.meta.url)"
          if aurora_const not in manual:
              manual = manual.replace(anchor, anchor + '\n' + aurora_const, 1)
          read_anchor = "  const source = await readFile(notesWorkspacePath, 'utf8')"
          if "const auroraSheet = await readFile(auroraSheetPath, 'utf8')" not in manual:
              manual = manual.replace(read_anchor, read_anchor + "\n  const auroraSheet = await readFile(auroraSheetPath, 'utf8')", 1)
          manual = manual.replace(
              "  assert.match(source, /className=\\{`note-manual-sync/)\n  assert.match(source, /onClick=\\{\\(\\) => void flushPendingContent\\(\\)\\}/)",
              "  assert.match(source, /onFlush=\\{flushPendingContent\\}/)\n  assert.match(auroraSheet, /native-manual-sync/)\n  assert.match(auroraSheet, /onClick=\\{\\(\\) => void props\\.onFlush\\(\\)\\}/)\n  assert.match(auroraSheet, /aria-label=\\\"Sincronizar y guardar nota ahora\\\"/)",
          )
          manual = manual.replace("  assert.match(source, /onBlur=\\{\\(\\) => undefined\\}/)\n", '')
          shadow_assert = "  assert.match(guard, /shadowRoot\\?\\.activeElement/)"
          if shadow_assert not in manual:
              marker = "  assert.match(guard, /editableElement\\(\\)/)"
              manual = manual.replace(marker, marker + '\n' + shadow_assert, 1)
          manual_test_path.write_text(manual)

          visual_test_path = Path('tests/noteOrganizerVisualRefresh.test.ts')
          visual = visual_test_path.read_text()
          visual_anchor = "const personalization = readFileSync('src/features/notes/WorkspacePersonalizationRuntime.tsx', 'utf8')"
          visual_aurora = "const auroraNativeSheet = readFileSync('src/features/notes/themes/aurora-native/AuroraNativeNoteSheet.tsx', 'utf8')"
          if visual_aurora not in visual:
              visual = visual.replace(visual_anchor, visual_anchor + '\n' + visual_aurora, 1)
          visual = visual.replace(
              "  assert.match(notesWorkspace, /aria-label=\"Sincronizar y guardar nota ahora\"/)",
              "  assert.match(auroraNativeSheet, /aria-label=\"Sincronizar y guardar nota ahora\"/)",
          )
          visual = visual.replace(
              "  assert.match(notesWorkspace, />\\s*Sincronizar\\s*</)",
              "  assert.match(auroraNativeSheet, /aria-label=\"Sincronizar y guardar nota ahora\"/)",
          )
          visual_test_path.write_text(visual)
          PY

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved conflicts remain:"
            printf '%s\n' "$unresolved"
            exit 1
          fi

          git add -A
          git commit -m "chore: sync Aurora with manual-save main [aurora-sync-done]"
          git push origin HEAD:feat/aurora-native-note-sheet
